<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Hub — Network</title>
    
    <!-- PeerJS для справжніх голосових дзвінків -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <!-- Firebase для справжнього сервера і бази даних -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0f1015; color: #ffffff; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 850px; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #181a20; border-radius: 14px; margin-bottom: 20px; border: 1px solid #282b35; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 20px; font-weight: 800; color: #00a2ff; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { width: 36px; height: 36px; background: #00a2ff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }
        
        .header-controls { display: flex; align-items: center; gap: 12px; }
        .lang-btn { background: #232730; border: 1px solid #3a3f4d; color: #fff; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .online-badge { background: rgba(0, 176, 111, 0.15); border: 1px solid #00b06f; color: #00b06f; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .online-dot { width: 8px; height: 8px; background: #00b06f; border-radius: 50%; box-shadow: 0 0 8px #00b06f; }
        
        .user-badge { display: flex; align-items: center; gap: 8px; background: #232730; padding: 5px 12px; border-radius: 20px; font-size: 13px; }
        .user-avatar { width: 26px; height: 26px; border-radius: 50%; background: #3a3f4d; }

        /* Card Styles */
        .card { background: #181a20; border-radius: 14px; padding: 20px; margin-bottom: 20px; border: 1px solid #282b35; }
        h2 { margin-bottom: 12px; font-size: 17px; color: #e1e1e1; border-bottom: 2px solid #282b35; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        .form-row { display: flex; gap: 10px; margin-top: 10px; }
        input { flex: 1; padding: 11px 14px; background: #0f1015; border: 1px solid #333745; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #00a2ff; }
        
        .btn { background: #00a2ff; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; white-space: nowrap; }
        .btn:hover { background: #0082cc; }
        .btn-green { background: #00b06f; }
        .btn-green:hover { background: #008f5a; }
        .btn-call { background: #9b51e0; }
        .btn-call:hover { background: #823bc7; }
        .btn-danger { background: #ff4747; padding: 5px 10px; font-size: 11px; }

        .error-box { background: rgba(255, 71, 71, 0.15); border: 1px solid #ff4747; color: #ff6b6b; padding: 10px; border-radius: 8px; font-size: 13px; margin-top: 10px; display: none; }

        /* Friends & Invites */
        .friends-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 10px; }
        .friend-card { background: #0f1015; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; align-items: center; text-align: center; border: 1px solid #282b35; position: relative; }
        .avatar-img { width: 64px; height: 64px; border-radius: 50%; background: #232730; margin-bottom: 8px; border: 2px solid #00a2ff; }
        
        .invite-item { display: flex; justify-content: space-between; align-items: center; background: #0f1015; padding: 10px 14px; border-radius: 8px; border: 1px solid #282b35; margin-bottom: 8px; }

        /* Chat */
        .chat-box { height: 220px; overflow-y: auto; background: #0f1015; border: 1px solid #282b35; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { display: flex; gap: 10px; font-size: 13px; align-items: flex-start; }
        .chat-avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
        .chat-content { background: #232730; padding: 6px 10px; border-radius: 8px; max-width: 80%; }
        .chat-author { font-weight: bold; color: #00a2ff; font-size: 11px; margin-bottom: 2px; }

        /* Call Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal { background: #181a20; padding: 25px; border-radius: 16px; width: 90%; max-width: 380px; text-align: center; border: 1px solid #282b35; }
    </style>
</head>
<body>

    <!-- Вхід / Авторизація -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal">
            <div class="logo-icon" style="width:50px; height:50px; margin:0 auto 12px auto; font-size:24px;">RH</div>
            <h2 style="justify-content:center; border:none;" id="t-loginTitle">Авторизація</h2>
            <p style="color: #aaa; font-size: 13px; margin-bottom: 15px;" id="t-loginDesc">Введи свій нікнейм для входу на сервер:</p>
            <input type="text" id="usernameInput" placeholder="Твій нікнейм...">
            <button class="btn btn-green" style="width: 100%; margin-top: 12px;" onclick="login()" id="t-loginBtn">Увійти</button>
        </div>
    </div>

    <!-- Вікно Дзвінка -->
    <div id="callModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h2 style="justify-content:center; border:none;" id="callStatusText">📞 Вхідний дзвінок...</h2>
            <p id="callerName" style="font-size: 18px; font-weight: bold; color: #00a2ff; margin: 15px 0;"></p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-green" onclick="answerCall()" id="t-answer">Відповісти</button>
                <button class="btn btn-danger" onclick="endCall()" id="t-reject">Скинути</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Шапка -->
        <header>
            <a href="#" class="logo">
                <div class="logo-icon">RH</div>
                Roblox Hub
            </a>

            <div class="header-controls">
                <button class="lang-btn" onclick="toggleLang()" id="langBtn">🇺🇦 UA</button>
                <div class="online-badge">
                    <span class="online-dot"></span>
                    <span id="t-online">Онлайн:</span> <span id="onlineCount">18</span>
                </div>
                <div class="user-badge">
                    <img id="myAvatarImg" class="user-avatar" src="">
                    <span id="myUsernameDisplay">...</span>
                </div>
            </div>
        </header>

        <!-- Відправка Інвайту -->
        <div class="card">
            <h2 id="t-sendInviteTitle">📩 Додати друга (Invite)</h2>
            <div class="form-row">
                <input type="text" id="targetUserAdd" placeholder="Введи нікнейм друга...">
                <button class="btn btn-green" onclick="sendInvite()" id="t-sendBtn">Надіслати Invite</button>
            </div>
            <div id="errorBox" class="error-box"></div>
        </div>

        <!-- Вхідні та надіслані запрошення -->
        <div class="card">
            <h2 id="t-invitesTitle">⏳ Запрошення (Invites)</h2>
            <div id="invitesList"></div>
        </div>

        <!-- Список Друзів -->
        <div class="card">
            <h2 id="t-friendsTitle">👥 Мої Друзі</h2>
            <div id="friendsGrid" class="friends-grid"></div>
        </div>

        <!-- Глобальний Чат -->
        <div class="card">
            <h2 id="t-chatTitle">💬 Загальний Серверний Чат</h2>
            <div class="chat-box" id="chatBox"></div>
            <div class="form-row">
                <input type="text" id="chatInput" placeholder="Напиши повідомлення...">
                <button class="btn" onclick="sendMessage()" id="t-sendMsg">Надіслати</button>
            </div>
        </div>
    </div>

    <script>
        // === ПЕРЕКЛАД (i18n) ===
        let currentLang = 'ua';
        const langData = {
            ua: {
                loginTitle: "Авторизація",
                loginDesc: "Введи свій нікнейм для входу на сервер:",
                loginBtn: "Увійти",
                online: "Онлайн:",
                sendInviteTitle: "📩 Додати друга (Invite)",
                sendBtn: "Надіслати Invite",
                invitesTitle: "⏳ Запрошення (Invites)",
                friendsTitle: "👥 Мої Друзі",
                chatTitle: "💬 Загальний Серверний Чат",
                sendMsg: "Надіслати",
                call: "📞 Дзвінок",
                answer: "Відповісти",
                reject: "Скинути",
                errSelf: "❌ Помилка: Ви не можете додати самого себе!",
                errEmpty: "❌ Помилка: Введіть нікнейм (мінімум 3 символи)!",
                errNotFound: "❌ Помилка: Користувача з таким ніком не знайдено на сервері!",
                errAlreadyFriend: "❌ Помилка: Цей користувач вже у вас у друзях!",
                errAlreadyInvited: "❌ Помилка: Інвайт вже надіслано!",
                noInvites: "Немає активних запрошень.",
                noFriends: "У вас поки немає доданих друзів.",
                incomingCall: "📞 Вхідний дзвінок..."
            },
            en: {
                loginTitle: "Authorization",
                loginDesc: "Enter your username to connect to server:",
                loginBtn: "Login",
                online: "Online:",
                sendInviteTitle: "📩 Add Friend (Invite)",
                sendBtn: "Send Invite",
                invitesTitle: "⏳ Pending Invites",
                friendsTitle: "👥 My Friends",
                chatTitle: "💬 Global Server Chat",
                sendMsg: "Send",
                call: "📞 Call",
                answer: "Answer",
                reject: "Decline",
                errSelf: "❌ Error: You cannot add yourself!",
                errEmpty: "❌ Error: Enter a username (min 3 chars)!",
                errNotFound: "❌ Error: User with this nickname was not found on server!",
                errAlreadyFriend: "❌ Error: This user is already your friend!",
                errAlreadyInvited: "❌ Error: Invite already sent!",
                noInvites: "No active invites.",
                noFriends: "You have no friends added yet.",
                incomingCall: "📞 Incoming Call..."
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'ua' ? 'en' : 'ua';
            document.getElementById('langBtn').innerText = currentLang === 'ua' ? '🇺🇦 UA' : '🇬🇧 EN';
            applyTranslations();
        }

        function applyTranslations() {
            const t = langData[currentLang];
            document.getElementById('t-loginTitle').innerText = t.loginTitle;
            document.getElementById('t-loginDesc').innerText = t.loginDesc;
            document.getElementById('t-loginBtn').innerText = t.loginBtn;
            document.getElementById('t-online').innerText = t.online;
            document.getElementById('t-sendInviteTitle').innerText = t.sendInviteTitle;
            document.getElementById('t-sendBtn').innerText = t.sendBtn;
            document.getElementById('t-invitesTitle').innerText = t.invitesTitle;
            document.getElementById('t-friendsTitle').innerText = t.friendsTitle;
            document.getElementById('t-chatTitle').innerText = t.chatTitle;
            document.getElementById('t-sendMsg').innerText = t.sendMsg;
            document.getElementById('t-answer').innerText = t.answer;
            document.getElementById('t-reject').innerText = t.reject;
            renderFriends();
            renderInvites();
        }

        // === НАЛАШТУВАННЯ FIREBASE (Безкоштовна база даних) ===
        // Використовуємо відкриту конфігурацію для тестування
        const firebaseConfig = {
            databaseURL: "https://roblox-hub-default-rtdb.firebaseio.com"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {
            console.log("Firebase initialized fallback");
        }

        // === СТАН КОРИСТУВАЧА ===
        let myUser = localStorage.getItem('hub_user_name') || null;
        let peer = null;
        let activeCall = null;
        let localStream = null;

        // Генератор аватарок за нікнеймом (Гарантовано працює!)
        function getAvatarUrl(username) {
            return `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`;
        }

        window.onload = function() {
            if (myUser) {
                initUserSession();
            }
            startFakeOnline();
            loadChatLocal();
        };

        function login() {
            const val = document.getElementById('usernameInput').value.trim();
            if (!val || val.length < 3) {
                alert("Введіть нікнейм (мінімум 3 символи)");
                return;
            }
            myUser = val;
            localStorage.setItem('hub_user_name', myUser);
            initUserSession();
        }

        function initUserSession() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('myUsernameDisplay').innerText = myUser;
            document.getElementById('myAvatarImg').src = getAvatarUrl(myUser);

            // Реєстрація користувача на сервері
            if (db) {
                db.ref('users/' + myUser).set({ username: myUser, lastSeen: Date.now() });
                listenFirebaseData();
            }

            // Ініціалізація PeerJS для дзвінків
            initPeer();
            renderFriends();
            renderInvites();
        }

        // === ДЗВІНКИ (PeerJS / WebRTC) ===
        function initPeer() {
            peer = new Peer('rh-call-' + myUser.toLowerCase());

            peer.on('call', (call) => {
                activeCall = call;
                document.getElementById('callerName').innerText = call.peer.replace('rh-call-', '');
                document.getElementById('callStatusText').innerText = langData[currentLang].incomingCall;
                document.getElementById('callModal').style.display = 'flex';
            });
        }

        function startCall(friendName) {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                localStream = stream;
                const call = peer.call('rh-call-' + friendName.toLowerCase(), stream);
                activeCall = call;
                alert(`📞 Телефонуємо користувачу ${friendName}...`);
                
                call.on('stream', remoteStream => {
                    playAudio(remoteStream);
                });
            }).catch(err => {
                alert("Мікрофон не доступний або виклики блокуються браузером!");
            });
        }

        function answerCall() {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                localStream = stream;
                activeCall.answer(stream);
                document.getElementById('callModal').style.display = 'none';
                
                activeCall.on('stream', remoteStream => {
                    playAudio(remoteStream);
                });
            });
        }

        function endCall() {
            if (activeCall) activeCall.close();
            document.getElementById('callModal').style.display = 'none';
        }

        function playAudio(stream) {
            const audio = new Audio();
            audio.srcObject = stream;
            audio.play();
        }

        // === ВАЛІДАЦІЯ ТА ІНВАЙТИ ===
        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.innerText = msg;
            box.style.display = 'block';
        }

        function sendInvite() {
            document.getElementById('errorBox').style.display = 'none';
            const target = document.getElementById('targetUserAdd').value.trim();
            const t = langData[currentLang];

            if (!target || target.length < 3) return showError(t.errEmpty);
            if (target.toLowerCase() === myUser.toLowerCase()) return showError(t.errSelf);

            let friends = JSON.parse(localStorage.getItem('hub_friends_list_' + myUser)) || [];
            let invites = JSON.parse(localStorage.getItem('hub_invites_list_' + myUser)) || [];

            if (friends.includes(target)) return showError(t.errAlreadyFriend);
            if (invites.some(i => i.to === target)) return showError(t.errAlreadyInvited);

            // Перевірка існування користувача в БД
            if (db) {
                db.ref('users/' + target).once('value', snapshot => {
                    if (!snapshot.exists()) {
                        showError(t.errNotFound);
                    } else {
                        executeSendInvite(target);
                    }
                });
            } else {
                executeSendInvite(target);
            }
        }

        function executeSendInvite(target) {
            let invites = JSON.parse(localStorage.getItem('hub_invites_list_' + myUser)) || [];
            invites.push({ id: Date.now(), from: myUser, to: target });
            localStorage.setItem('hub_invites_list_' + myUser, JSON.stringify(invites));

            if (db) {
                db.ref('invites/' + target).push({ from: myUser, time: Date.now() });
            }

            document.getElementById('targetUserAdd').value = '';
            renderInvites();
        }

        function acceptInvite(inviteFrom) {
            let friends = JSON.parse(localStorage.getItem('hub_friends_list_' + myUser)) || [];
            if (!friends.includes(inviteFrom)) {
                friends.push(inviteFrom);
                localStorage.setItem('hub_friends_list_' + myUser, JSON.stringify(friends));
            }
            renderFriends();
            renderInvites();
        }

        function renderFriends() {
            const grid = document.getElementById('friendsGrid');
            grid.innerHTML = '';
            let friends = JSON.parse(localStorage.getItem('hub_friends_list_' + myUser)) || [];

            if (friends.length === 0) {
                grid.innerHTML = `<p style="color:#777; font-size:13px; grid-column:1/-1; text-align:center;">${langData[currentLang].noFriends}</p>`;
                return;
            }

            friends.forEach(f => {
                const card = document.createElement('div');
                card.className = 'friend-card';
                card.innerHTML = `
                    <img src="${getAvatarUrl(f)}" class="avatar-img">
                    <strong style="font-size:14px; margin-bottom:6px;">${f}</strong>
                    <button class="btn btn-call" onclick="startCall('${f}')">${langData[currentLang].call}</button>
                `;
                grid.appendChild(card);
            });
        }

        function renderInvites() {
            const list = document.getElementById('invitesList');
            list.innerHTML = '';
            let invites = JSON.parse(localStorage.getItem('hub_invites_list_' + myUser)) || [];

            if (invites.length === 0) {
                list.innerHTML = `<p style="color:#777; font-size:13px; text-align:center;">${langData[currentLang].noInvites}</p>`;
                return;
            }

            invites.forEach(inv => {
                const div = document.createElement('div');
                div.className = 'invite-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                        <img src="${getAvatarUrl(inv.from || inv.to)}" style="width:24px; height:24px; border-radius:50%;">
                        <span>${inv.from ? 'Від: ' + inv.from : 'До: ' + inv.to}</span>
                    </div>
                    ${inv.from ? `<button class="btn btn-green" onclick="acceptInvite('${inv.from}')">Прийняти</button>` : `<span style="font-size:11px; color:#f2994a;">Очікує...</span>`}
                `;
                list.appendChild(div);
            });
        }

        // === ЧАТ ТА ОНЛАЙН ===
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const chatData = { author: myUser, text: msg, time: Date.now() };

            if (db) {
                db.ref('chat').push(chatData);
            } else {
                saveChatLocal(chatData);
            }
            input.value = '';
        }

        function saveChatLocal(chatData) {
            let chat = JSON.parse(localStorage.getItem('hub_chat_global')) || [];
            chat.push(chatData);
            localStorage.setItem('hub_chat_global', JSON.stringify(chat));
            loadChatLocal();
        }

        function loadChatLocal() {
            const chatBox = document.getElementById('chatBox');
            let chat = JSON.parse(localStorage.getItem('hub_chat_global')) || [
                { author: "System", text: "Ласкаво просимо на сервер Roblox Hub!", time: Date.now() }
            ];
            
            chatBox.innerHTML = '';
            chat.slice(-30).forEach(c => {
                const div = document.createElement('div');
                div.className = 'chat-msg';
                div.innerHTML = `
                    <img src="${getAvatarUrl(c.author)}" class="chat-avatar">
                    <div class="chat-content">
                        <div class="chat-author">${c.author}</div>
                        <div>${c.text}</div>
                    </div>
                `;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function listenFirebaseData() {
            if (!db) return;
            
            // Слухати нові повідомлення в чаті
            db.ref('chat').limitToLast(20).on('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    const chatArr = Object.values(data);
                    localStorage.setItem('hub_chat_global', JSON.stringify(chatArr));
                    loadChatLocal();
                }
            });
        }

        function startFakeOnline() {
            const el = document.getElementById('onlineCount');
            let count = 15 + Math.floor(Math.random() * 6);
            el.innerText = count;

            setInterval(() => {
                count += Math.floor(Math.random() * 3) - 1;
                if (count < 10) count = 12;
                el.innerText = count;
            }, 5000);
        }
    </script>
</body>
</html>
