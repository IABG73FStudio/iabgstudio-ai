<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IABG Meet - Відеодзвінки</title>
    
    <!-- Бібліотека PeerJS для реального глобального зв'язку -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ЛОБІ */
        #lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }

        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 { margin-top: 0; color: #00a2ff; }
        p { color: #aaa; font-size: 14px; }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 15px;
        }

        input { background: #2a2a2a; color: #fff; text-align: center; }

        button {
            background: #00a2ff;
            color: #fff;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #0084cc; }
        .btn-join { background: #00b06f; }
        .btn-join:hover { background: #008f5a; }

        #errorMsg {
            color: #ff4747;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        /* СІТКА ДЗВІНКУ ТА ЕФЕКТ БІЛОГО СЯЙВА ПРИ РОЗМОВІ */
        #callRoom {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #videoGrid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            padding: 15px;
            background: #000;
            overflow-y: auto;
        }

        .video-container {
            position: relative;
            background: #222;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
            border: 3px solid transparent;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        /* КОЛИ ЛЮДИНА ГОВОРИТЬ — РАМКА СВІТИТЬСЯ БІЛИМ */
        .video-container.speaking {
            border-color: #ffffff !important;
            box-shadow: 0 0 20px 4px rgba(255, 255, 255, 0.9) !important;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            z-index: 2;
        }

        .controls {
            height: 75px;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 10px;
        }

        .ctrl-btn {
            width: auto;
            padding: 10px 18px;
            margin: 0;
            border-radius: 30px;
            font-size: 14px;
        }

        .btn-red { background: #ff4747; }
        .btn-red:hover { background: #cc3737; }
        .btn-gray { background: #444; }
        .btn-gray:hover { background: #555; }
    </style>
</head>
<body>

    <!-- ЕКРАН ВХОДУ -->
    <div id="lobby">
        <div class="card">
            <h1>IABG Meet 🎥</h1>
            <p>Введи код або створи нову кімнату</p>
            
            <button onclick="createRoom()">➕ Створити новий дзвінок</button>
            
            <div style="margin: 10px 0; color: #555;">— АБО —</div>
            
            <input type="text" id="roomInput" placeholder="Введіть код кімнати">
            <button class="btn-join" onclick="joinByInput()">Приєднатися</button>

            <!-- ЧЕРВОНА ПОМИЛКА ЗНИЗУ -->
            <div id="errorMsg"></div>
        </div>
    </div>

    <!-- КІМНАТА ДЗВІНКУ -->
    <div id="callRoom">
        <div id="videoGrid"></div>

        <div class="controls">
            <button class="ctrl-btn btn-gray" id="micBtn" onclick="toggleMic()">🎤 Мікрофон</button>
            <button class="ctrl-btn btn-gray" id="camBtn" onclick="toggleCam()">📹 Камера</button>
            <button class="ctrl-btn btn-gray" onclick="copyRoomLink()">🔗 Скопіювати посилання</button>
            <button class="ctrl-btn btn-red" onclick="leaveCall()">📞 Завершити</button>
        </div>
    </div>

    <script>
        let localStream;
        let peer;
        let isMicOn = true;
        let isCamOn = true;
        const connectedPeers = {};

        window.onload = () => {
            const hashRoom = window.location.hash.substring(1);
            if (hashRoom) {
                document.getElementById('roomInput').value = hashRoom;
                joinRoom(hashRoom);
            }
        };

        function showError(msg) {
            document.getElementById('errorMsg').innerText = msg;
        }

        function clearError() {
            document.getElementById('errorMsg').innerText = "";
        }

        async function getMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                return true;
            } catch (err) {
                showError("❌ Дозвольте доступ до камери та мікрофона у браузері!");
                return false;
            }
        }

        // СТВОРЕННЯ КІМНАТИ
        async function createRoom() {
            clearError();
            const hasMedia = await getMedia();
            if (!hasMedia) return;

            const roomId = 'meet-' + Math.random().toString(36).substring(2, 8);
            window.location.hash = roomId;

            peer = new Peer(roomId);

            peer.on('open', (id) => {
                showCallScreen();
                addVideoStream('local', localStream, 'Ви (Господар)');
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    addVideoStream(call.peer, remoteStream, `Учасник (${call.peer.substring(0, 4)})`);
                });
                call.on('close', () => removeVideoStream(call.peer));
                connectedPeers[call.peer] = call;
            });

            peer.on('error', (err) => {
                showError("❌ Помилка сервера: " + err.type);
            });
        }

        // ПРИЄДНАННЯ ДО КІМНАТИ ЗА КОДОМ
        function joinByInput() {
            clearError();
            const roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) {
                showError("❌ Введіть код або посилання кімнати!");
                return;
            }
            joinRoom(roomId);
        }

        async function joinRoom(roomId) {
            clearError();
            const hasMedia = await getMedia();
            if (!hasMedia) return;

            peer = new Peer();

            peer.on('open', (id) => {
                const call = peer.call(roomId, localStream);
                let connected = false;

                call.on('stream', (remoteStream) => {
                    connected = true;
                    showCallScreen();
                    addVideoStream('local', localStream, 'Ви');
                    addVideoStream(roomId, remoteStream, 'Господар');
                });

                call.on('close', () => removeVideoStream(roomId));

                peer.on('call', (incomingCall) => {
                    incomingCall.answer(localStream);
                    incomingCall.on('stream', (remoteStream) => {
                        addVideoStream(incomingCall.peer, remoteStream, `Учасник (${incomingCall.peer.substring(0, 4)})`);
                    });
                    incomingCall.on('close', () => removeVideoStream(incomingCall.peer));
                });

                setTimeout(() => {
                    if (!connected) {
                        showError("❌ Кімнату з таким кодом не знайдено!");
                        if (localStream) localStream.getTracks().forEach(t => t.stop());
                        peer.destroy();
                    }
                }, 4000);
            });

            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    showError("❌ Помилка: Кімнату з таким кодом не знайдено!");
                } else {
                    showError("❌ Помилка з'єднання з сервером: " + err.type);
                }
            });
        }

        // ДОДАВАННЯ ВІДЕО ТА ДЕТЕКТОР ГОЛОСУ
        function addVideoStream(peerId, stream, labelText) {
            if (document.getElementById('container-' + peerId)) return;

            const grid = document.getElementById('videoGrid');
            const container = document.createElement('div');
            container.className = 'video-container';
            container.id = 'container-' + peerId;

            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (peerId === 'local') video.muted = true;

            const label = document.createElement('div');
            label.className = 'user-label';
            label.innerText = labelText;

            container.appendChild(video);
            container.appendChild(label);
            grid.appendChild(container);

            // Підключаємо аналізатор гучності для білого сяйва
            setupVoiceDetection(stream, container.id);
        }

        // ФУНКЦІЯ: БІЛЕ СЯЙВО ПРИ ГОЛОВІ (Web Audio API)
        function setupVoiceDetection(stream, containerId) {
            try {
                const audioTracks = stream.getAudioTracks();
                if (audioTracks.length === 0) return;

                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function checkVolume() {
                    const container = document.getElementById(containerId);
                    if (!container) return; // якщо учасник вийшов, зупиняємо перевірку

                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        sum += dataArray[i];
                    }
                    let average = sum / dataArray.length;

                    // Якщо гучність більша ніж порог (людина говорить)
                    if (average > 18) {
                        container.classList.add('speaking');
                    } else {
                        container.classList.remove('speaking');
                    }

                    requestAnimationFrame(checkVolume);
                }

                checkVolume();
            } catch (e) {
                console.log("Помилка детектора голосу:", e);
            }
        }

        function removeVideoStream(peerId) {
            const container = document.getElementById('container-' + peerId);
            if (container) container.remove();
        }

        function showCallScreen() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('callRoom').style.display = 'flex';
        }

        function copyRoomLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("🔗 Посилання скопійовано! Відправ його друзям.");
        }

        function toggleMic() {
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            const btn = document.getElementById('micBtn');
            btn.innerText = isMicOn ? "🎤 Мікрофон" : "🔇 Мікрофон (Вимк)";
            btn.style.background = isMicOn ? "#444" : "#ff4747";
        }

        function toggleCam() {
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;
            const btn = document.getElementById('camBtn');
            btn.innerText = isCamOn ? "📹 Камера" : "📷 Камера (Вимк)";
            btn.style.background = isCamOn ? "#444" : "#ff4747";
        }

        function leaveCall() {
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            if (peer) peer.destroy();
            window.location.hash = "";
            location.reload();
        }
    </script>
</body>
</html>
