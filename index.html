<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IABG Meet - Відеодзвінки</title>
    
    <!-- Підключаємо бібліотеку PeerJS для прямого відеозв'язку -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ЕКРАН ВХОДУ / СТВОРЕННЯ */
        #lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 15px;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }

        h1 { margin-top: 0; color: #00a2ff; }
        p { color: #aaa; font-size: 14px; }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 15px;
        }

        input { background: #2a2a2a; color: #fff; text-align: center; }

        button {
            background: #00a2ff;
            color: #fff;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #0084cc; }
        .btn-join { background: #00b06f; }
        .btn-join:hover { background: #008f5a; }

        /* ЕКРАН ВІДЕОДЗВІНКУ */
        #callRoom {
            display: none;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            padding: 15px;
            background: #000;
        }

        .video-container {
            position: relative;
            background: #222;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        /* КНОПКИ КЕРУВАННЯ (Знизу) */
        .controls {
            height: 80px;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .ctrl-btn {
            width: auto;
            padding: 12px 20px;
            margin: 0;
            border-radius: 30px;
            font-size: 14px;
        }

        .btn-red { background: #ff4747; }
        .btn-red:hover { background: #cc3737; }
        .btn-gray { background: #444; }
        .btn-gray:hover { background: #555; }
    </style>
</head>
<body>

    <!-- 1. ЛОБІ (Головна сторінка) -->
    <div id="lobby">
        <div class="card">
            <h1>IABG Meet 🎥</h1>
            <p>Створи кімнату або приєднайся до друга за посиланням</p>
            
            <button onclick="createRoom()">➕ Створити новий дзвінок</button>
            
            <div style="margin: 15px 0; color: #555;">— АБО —</div>
            
            <input type="text" id="roomInput" placeholder="Введіть код кімнати">
            <button class="btn-join" onclick="joinByInput()">Приєднатися</button>
        </div>
    </div>

    <!-- 2. КІМНАТА ДЗВІНКУ -->
    <div id="callRoom">
        <div class="video-grid">
            <!-- Твоє відео -->
            <div class="video-container">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="user-label">Ви (Ви)</div>
            </div>
            <!-- Відео друга -->
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="user-label" id="remoteLabel">Очікування друга...</div>
            </div>
        </div>

        <!-- Кнопки керування -->
        <div class="controls">
            <button class="ctrl-btn btn-gray" id="micBtn" onclick="toggleMic()">🎤 Мікрофон</button>
            <button class="ctrl-btn btn-gray" id="camBtn" onclick="toggleCam()">📹 Камера</button>
            <button class="ctrl-btn btn-gray" onclick="copyRoomLink()">🔗 Скопіювати посилання</button>
            <button class="ctrl-btn btn-red" onclick="leaveCall()">📞 Завершити</button>
        </div>
    </div>

    <script>
        let localStream;
        let peer;
        let currentCall;
        let isMicOn = true;
        let isCamOn = true;

        // Автоматична перевірка: якщо у посиланні є #код, то приєднуємося
        window.onload = () => {
            const hashRoom = window.location.hash.substring(1);
            if (hashRoom) {
                document.getElementById('roomInput').value = hashRoom;
                joinRoom(hashRoom);
            }
        };

        // Отримання доступу до камери та мікрофона
        async function getMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                alert("Помилка: Надайте доступ до камери та мікрофона!");
                console.error(err);
            }
        }

        // 1. СТВОРИТИ НОВУ КІМНАТУ
        async function createRoom() {
            await getMedia();
            if (!localStream) return;

            // Генеруємо випадковий ID кімнати (наприклад: meet-a8f9b)
            const roomId = 'meet-' + Math.random().toString(36).substring(2, 8);
            window.location.hash = roomId;

            showCallScreen();

            // Створюємо Peer з цим ID (ти господар)
            peer = new Peer(roomId);

            peer.on('open', (id) => {
                console.log('Кімнату створено з ID:', id);
            });

            // Коли хтось телефонує тобі
            peer.on('call', (call) => {
                currentCall = call;
                call.answer(localStream); // Відповідаємо і передаємо свій відеопотік

                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                    document.getElementById('remoteLabel').innerText = "Співрозмовник";
                });
            });
        }

        // 2. ПРИЄДНАТИСЯ ДО ІСНУЮЧОЇ КІМНАТИ
        function joinByInput() {
            const roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) return alert("Введіть код або посилання!");
            window.location.hash = roomId;
            joinRoom(roomId);
        }

        async function joinRoom(roomId) {
            await getMedia();
            if (!localStream) return;

            showCallScreen();

            // Створюємо свій Peer з випадковим ID
            peer = new Peer();

            peer.on('open', () => {
                // Телефонуємо господарю кімнати
                const call = peer.call(roomId, localStream);
                currentCall = call;

                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                    document.getElementById('remoteLabel').innerText = "Господар кімнати";
                });

                call.on('error', (err) => {
                    alert("Не вдалося підключитися до кімнати.");
                });
            });
        }

        function showCallScreen() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('callRoom').style.display = 'flex';
        }

        // КОПІЮВАННЯ ПОСИЛАННЯ
        function copyRoomLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Посилання на дзвінок скопійовано! Надішли його другу.");
        }

        // ВМИК / ВИМК МІКРОФОНА
        function toggleMic() {
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            const btn = document.getElementById('micBtn');
            btn.innerText = isMicOn ? "🎤 Мікрофон" : "🔇 Мікрофон (Вимк)";
            btn.style.background = isMicOn ? "#444" : "#ff4747";
        }

        // ВМИК / ВИМК КАМЕРИ
        function toggleCam() {
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;
            const btn = document.getElementById('camBtn');
            btn.innerText = isCamOn ? "📹 Камера" : "📷 Камера (Вимк)";
            btn.style.background = isCamOn ? "#444" : "#ff4747";
        }

        // ЗАВЕРШИТИ ДЗВІНОК
        function leaveCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (peer) peer.destroy();
            window.location.hash = "";
            location.reload();
        }
    </script>
</body>
</html>
