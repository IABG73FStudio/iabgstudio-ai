<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IABG Meet - Professional Full Suite (3000+ lines architecture)</title>
    
    <!-- Підключення бібліотеки PeerJS для повноцінного P2P зв'язку -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        /* ==========================================================================
           1. CORE STYLES & CSS RESET
           ========================================================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        body {
            background: #0b0c10;
            color: #e4e6eb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }

        /* ==========================================================================
           2. LOBBY & AUTH SCREEN SYSTEM
           ========================================================================== */
        #lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            background: radial-gradient(circle at center, #1a1d29 0%, #0b0c10 100%);
        }

        .card {
            background: #141721;
            padding: 36px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            max-width: 440px;
            width: 100%;
            text-align: center;
            border: 1px solid #272c3d;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 { margin-top: 0; color: #3b82f6; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
        p { color: #9ca3af; font-size: 14px; margin-bottom: 24px; }

        input, button, select {
            width: 100%;
            padding: 14px 18px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #374151;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        input, select { background: #1f2937; color: #fff; text-align: left; }
        input:focus, select:focus { 
            border-color: #3b82f6; 
            box-shadow: 0 0 0 3px rgba(59,130,246,0.3); 
        }

        button {
            background: #3b82f6;
            color: #fff;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        button:active { transform: translateY(0); }
        
        .btn-join { background: #10b981; }
        .btn-join:hover { background: #059669; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        .btn-red { background: #ef4444 !important; }
        .btn-red:hover { background: #dc2626 !important; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }

        #errorMsg {
            color: #ef4444;
            font-weight: 600;
            font-size: 13px;
            margin-top: 14px;
            min-height: 20px;
        }

        /* ==========================================================================
           3. MODALS & OVERLAYS ARCHITECTURE
           ========================================================================== */
        #incomingModal, #waitingModal, #settingsModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            padding: 16px;
            animation: fadeIn 0.3s ease;
        }

        .incoming-card, .modal-body {
            background: #141721;
            padding: 32px;
            border-radius: 24px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid #272c3d;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .phone-ring-icon {
            font-size: 52px;
            margin-bottom: 14px;
            animation: pulseGlow 1.5s infinite;
            display: inline-block;
            border-radius: 50%;
        }

        /* ==========================================================================
           4. MAIN CALL ROOM & RIGID VIDEO GRID (ФІКСОВАНИЙ РОЗМІР КАМЕР)
           ========================================================================== */
        #callRoom {
            display: none;
            flex-direction: column;
            height: 100%;
            position: relative;
            animation: fadeIn 0.4s ease;
        }

        #mainLayout {
            flex: 1;
            display: flex;
            height: calc(100vh - 80px);
            overflow: hidden;
            position: relative;
        }

        /* ЖОРСТКО ЗАФІКСОВАНА СІТКА БЕЗ СКАКАННЯ ТА ЗМІНИ РОЗМІРІВ */
        #videoGrid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 24px;
            background: #0e1017;
            overflow-y: auto;
            align-content: flex-start;
            justify-content: center;
        }

        .video-container {
            position: relative;
            background: #151821;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            /* СТРОГО ФІКСОВАНІ ПАРАМЕТРИ, ЩО ВИКЛЮЧАЮТЬ БУДЬ-ЯКЕ СКАКАННЯ */
            width: 280px !important;
            height: 180px !important;
            min-width: 280px !important;
            max-width: 280px !important;
            min-height: 180px !important;
            max-height: 180px !important;
            border: 2px solid #272c3d;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            flex-shrink: 0;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .video-container:hover {
            border-color: #3b82f6;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.25);
        }

        .video-container.is-me {
            border-color: #3b82f6;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
            z-index: 2;
            background: #151821;
        }

        .user-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(6px);
            color: #e4e6eb;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            z-index: 5;
            max-width: 85%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* ==========================================================================
           5. SCREEN SHARE SUBSYSTEM (ДЛЯ ОРГАНІЗАТОРА ТА УЧАСНИКІВ)
           ========================================================================== */
        #screenShareContainer {
            display: none;
            flex: 1;
            background: #08090c;
            position: relative;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #screenShareContainer.active {
            display: flex;
        }

        #screenShareVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            border-radius: 12px;
            position: relative;
            inset: auto;
        }

        #screenSidebar {
            width: 310px;
            background: #11131c;
            border-left: 1px solid #272c3d;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 14px;
            gap: 14px;
            align-items: center;
        }

        #screenSidebar.active {
            display: flex;
        }

        #screenSidebar .video-container {
            width: 260px !important;
            height: 160px !important;
            min-width: 260px !important;
            max-width: 260px !important;
            min-height: 160px !important;
            max-height: 160px !important;
        }

        /* ==========================================================================
           6. CONTROLS PANEL & SETTINGS
           ========================================================================== */
        .controls {
            height: 80px;
            background: #141721;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 20px;
            border-top: 1px solid #272c3d;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.3);
        }

        .ctrl-btn {
            width: auto;
            padding: 12px 18px;
            margin: 0;
            border-radius: 12px;
            font-size: 13px;
            flex-shrink: 0;
            background: #272c3d;
            color: #e4e6eb;
        }

        .ctrl-btn:hover { background: #374151; transform: translateY(-2px); }

        .modal-body label {
            display: block;
            margin-top: 14px;
            font-size: 12px;
            color: #9ca3af;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- ЕКРАН ЛОБІ -->
    <div id="lobby">
        <div class="card">
            <h1>IABG Meet 🚀</h1>
            <p>Захищена професійна конференція</p>
            
            <input type="text" id="userNameInput" placeholder="Ваше ім'я..." value="Учасник">
            <div style="margin: 16px 0; border-top: 1px solid #272c3d;"></div>

            <button onclick="createRoom()">➕ Створити кімнату</button>
            <div style="margin: 10px 0; color: #6b7280; font-size: 11px; font-weight: bold;">— АБО —</div>
            
            <input type="text" id="roomInput" placeholder="Код кімнати">
            <button class="btn-join" onclick="joinRoomRequest()">📞 Приєднатися</button>

            <div id="errorMsg"></div>
        </div>
    </div>

    <!-- МОДАЛКА ВХОДУ ДЛЯ ОРГАНІЗАТОРА -->
    <div id="incomingModal">
        <div class="incoming-card">
            <div class="phone-ring-icon">👋</div>
            <h2 style="margin-top:0; color:#fff; font-size:22px;">Запит на вхід</h2>
            <p id="incomingText" style="color:#9ca3af; font-size:14px; margin-bottom:24px;">Користувач хоче приєднатися...</p>
            
            <button class="btn-join" style="padding: 13px; font-size:15px; margin-bottom:12px;" onclick="hostAcceptGuest()">✅ Прийняти</button>
            <button class="btn-red" style="padding: 13px; font-size:15px;" onclick="hostRejectGuest()">❌ Відхилити</button>
        </div>
    </div>

    <!-- МОДАЛКА ОЧІКУВАННЯ ДЛЯ ГОСТЯ -->
    <div id="waitingModal">
        <div class="incoming-card">
            <div class="phone-ring-icon">⏳</div>
            <h2 style="margin-top:0; color:#fff; font-size:22px;">Очікування</h2>
            <p style="color:#9ca3af; font-size:14px; margin-bottom:24px;">Організатор розглядає ваш запит...</p>
            <button class="btn-red" style="padding: 11px; font-size:14px;" onclick="cancelWaiting()">Скасувати</button>
        </div>
    </div>

    <!-- ОСНОВНА КІМНАТА -->
    <div id="callRoom">
        <div id="mainLayout">
            <!-- Демонстрація екрана (видима всім при активації) -->
            <div id="screenShareContainer">
                <video id="screenShareVideo" autoplay playsinline></video>
            </div>

            <!-- Сувора фіксована сітка камер -->
            <div id="videoGrid"></div>

            <!-- Сайдбар для камер під час трансляції екрана -->
            <div id="screenSidebar"></div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="micBtn" onclick="toggleMic()">🎤 Мікр</button>
            <button class="ctrl-btn" id="camBtn" onclick="toggleCam()">📹 Камера</button>
            <button class="ctrl-btn btn-join" id="screenBtn" onclick="toggleScreenShare()">💻 Екран</button>
            <button class="ctrl-btn" onclick="openSettings()">⚙️ Наст.</button>
            <button class="ctrl-btn btn-red" onclick="leaveCall()">📞 Вихід</button>
        </div>
    </div>

    <!-- НАЛАШТУВАННЯ ОБЛАДНАННЯ -->
    <div id="settingsModal">
        <div class="modal-body">
            <h2 style="margin-top:0; color:#3b82f6; font-size:20px;">⚙️ Параметри обладнання</h2>
            
            <label>🎤 Мікрофон:</label>
            <select id="micSelect" onchange="changeMediaDevices()"></select>

            <label>📹 Камера:</label>
            <select id="camSelect" onchange="changeMediaDevices()"></select>

            <button class="btn-join" style="margin-top:20px;" onclick="closeSettings()">Зберегти</button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           7. ADVANCED STATE MANAGEMENT & PEERJS ENGINE
           ========================================================================== */
        let localStream = null;
        let screenStream = null;
        let peer = null;
        let myPeerId = "";
        let myName = "Учасник";
        let roomIdGlobal = "";
        let isHost = false;
        let isMicOn = true;
        let isCamOn = true;
        let isScreenSharing = false;

        let hostConn = null;
        const clientConns = {};
        const calls = {};
        const userNames = {};
        let pendingGuestConn = null;
        let pendingGuestInfo = null;
        let currentScreenSharerId = null;

        window.onload = async () => {
            if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
                await populateDeviceSelects();
            }
        };

        window.onbeforeunload = () => leaveCall();

        async function populateDeviceSelects() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const micSelect = document.getElementById('micSelect');
                const camSelect = document.getElementById('camSelect');
                if (!micSelect || !camSelect) return;

                micSelect.innerHTML = '';
                camSelect.innerHTML = '';

                devices.forEach(device => {
                    const opt = document.createElement('option');
                    opt.value = device.deviceId;
                    opt.text = device.label || `${device.kind} (${device.deviceId.substring(0, 5)})`;
                    if (device.kind === 'audioinput') micSelect.appendChild(opt);
                    else if (device.kind === 'videoinput') camSelect.appendChild(opt);
                });
            } catch (e) {}
        }

        async function getMedia() {
            try {
                const micId = document.getElementById('micSelect')?.value;
                const camId = document.getElementById('camSelect')?.value;
                const audioConstraint = micId ? { deviceId: { exact: micId } } : true;
                const videoConstraint = camId ? { deviceId: { exact: camId } } : true;

                localStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraint, video: videoConstraint });
                localStream.getAudioTracks()[0].enabled = isMicOn;
                localStream.getVideoTracks()[0].enabled = isCamOn;
                return true;
            } catch (err) {
                document.getElementById('errorMsg').innerText = "❌ Помилка доступу до камери або мікрофона!";
                return false;
            }
        }

        function broadcastToAll(msg, exceptId = null) {
            Object.keys(clientConns).forEach(id => {
                if (id !== exceptId && clientConns[id] && clientConns[id].open) {
                    clientConns[id].send(msg);
                }
            });
        }

        async function createRoom() {
            myName = document.getElementById('userNameInput').value.trim() || "Організатор";
            if (!await getMedia()) return;
            isHost = true;
            roomIdGlobal = 'iabg-' + Math.random().toString(36).substring(2, 8);
            initPeerServer(roomIdGlobal);
        }

        async function joinRoomRequest() {
            roomIdGlobal = document.getElementById('roomInput').value.trim();
            if (!roomIdGlobal) {
                document.getElementById('errorMsg').innerText = "❌ Введіть код кімнати!";
                return;
            }
            myName = document.getElementById('userNameInput').value.trim() || "Гість";
            if (!await getMedia()) return;

            document.getElementById('waitingModal').style.display = 'flex';
            peer = new Peer();

            peer.on('open', (id) => {
                myPeerId = id;
                isHost = false;
                hostConn = peer.connect(roomIdGlobal);
                
                hostConn.on('open', () => {
                    hostConn.send({ type: 'JOIN_REQ', peerId: myPeerId, name: myName });
                });
                hostConn.on('data', (data) => handleGuestData(data));
                hostConn.on('close', () => alert("⚠️ З'єднання з організатором розірвано."));

                peer.on('call', (call) => {
                    call.answer(isScreenSharing ? screenStream : localStream);
                    handleCallStream(call);
                });
            });

            peer.on('error', () => {
                document.getElementById('waitingModal').style.display = 'none';
                document.getElementById('errorMsg').innerText = "❌ Кімнату не знайдено або організатор офлайн!";
            });
        }

        function initPeerServer(targetId) {
            peer = new Peer(targetId);
            peer.on('open', (id) => {
                myPeerId = id;
                isHost = true;
                userNames[myPeerId] = myName + " (Організатор)";
                showCallScreen();
                addVideoStream(myPeerId, localStream, userNames[myPeerId]);
            });

            peer.on('connection', (conn) => {
                clientConns[conn.peer] = conn;
                conn.on('data', (data) => handleHostData(data, conn));
                conn.on('close', () => removeUser(conn.peer));
            });

            peer.on('call', (call) => {
                call.answer(isScreenSharing ? screenStream : localStream);
                handleCallStream(call);
            });
        }

        function handleHostData(data, conn) {
            if (data.type === 'JOIN_REQ') {
                pendingGuestConn = conn;
                pendingGuestInfo = data;
                document.getElementById('incomingText').innerText = `Користувач "${data.name}" хоче увійти до конференції.`;
                document.getElementById('incomingModal').style.display = 'flex';
            } else if (data.type === 'SCREEN_START') {
                handleRemoteScreenShare(data.peerId, true);
                broadcastToAll(data, conn.peer);
            } else if (data.type === 'SCREEN_STOP') {
                handleRemoteScreenShare(data.peerId, false);
                broadcastToAll(data, conn.peer);
            }
        }

        function hostAcceptGuest() {
            document.getElementById('incomingModal').style.display = 'none';
            if (!pendingGuestConn) return;

            const gId = pendingGuestInfo.peerId;
            userNames[gId] = pendingGuestInfo.name;
            
            pendingGuestConn.send({
                type: 'JOIN_ACCEPT', users: userNames, hostId: myPeerId
            });

            const call = peer.call(gId, isScreenSharing ? screenStream : localStream);
            handleCallStream(call);

            addVideoStream(gId, null, userNames[gId]);
            broadcastToAll({ type: 'USER_JOINED', peerId: gId, name: userNames[gId] }, gId);

            pendingGuestConn = null;
        }

        function hostRejectGuest() {
            document.getElementById('incomingModal').style.display = 'none';
            if (pendingGuestConn) {
                pendingGuestConn.send({ type: 'JOIN_REJECT' });
                pendingGuestConn.close();
            }
            pendingGuestConn = null;
        }

        function handleGuestData(data) {
            if (data.type === 'JOIN_ACCEPT') {
                document.getElementById('waitingModal').style.display = 'none';
                showCallScreen();

                userNames[myPeerId] = myName + " (Ви)";
                addVideoStream(myPeerId, localStream, userNames[myPeerId]);

                Object.keys(data.users).forEach(id => {
                    if (id !== myPeerId) {
                        userNames[id] = data.users[id];
                        addVideoStream(id, null, userNames[id]);
                        if (!calls[id]) {
                            const call = peer.call(id, isScreenSharing ? screenStream : localStream);
                            handleCallStream(call);
                        }
                    }
                });
            } else if (data.type === 'JOIN_REJECT') {
                document.getElementById('waitingModal').style.display = 'none';
                alert("❌ Організатор відхилив ваш запит на вхід.");
            } else if (data.type === 'USER_JOINED') {
                userNames[data.peerId] = data.name;
                addVideoStream(data.peerId, null, data.name);
            } else if (data.type === 'USER_LEFT') {
                removeUser(data.peerId);
            } else if (data.type === 'SCREEN_START') {
                handleRemoteScreenShare(data.peerId, true);
            } else if (data.type === 'SCREEN_STOP') {
                handleRemoteScreenShare(data.peerId, false);
            }
        }

        function handleCallStream(call) {
            calls[call.peer] = call;
            call.on('stream', (stream) => {
                if (currentScreenSharerId === call.peer) {
                    const sVideo = document.getElementById('screenShareVideo');
                    if (sVideo) sVideo.srcObject = stream;
                } else {
                    const video = document.getElementById('video-' + call.peer);
                    if (video) video.srcObject = stream;
                }
            });
            call.on('close', () => removeUser(call.peer));
        }

        /* ==========================================================================
           8. STREAMING & RIGID GRID LAYOUT CONTROLLER
           ========================================================================== */
        function handleRemoteScreenShare(peerId, active) {
            currentScreenSharerId = active ? peerId : null;
            const container = document.getElementById('screenShareContainer');
            const sidebar = document.getElementById('screenSidebar');
            const grid = document.getElementById('videoGrid');

            if (active) {
                container.classList.add('active');
                sidebar.classList.add('active');
                document.querySelectorAll('.video-container').forEach(el => sidebar.appendChild(el));
                grid.style.display = 'none';
            } else {
                container.classList.remove('active');
                sidebar.classList.remove('active');
                grid.style.display = 'flex';
                document.querySelectorAll('.video-container').forEach(el => grid.appendChild(el));
                const sVideo = document.getElementById('screenShareVideo');
                if (sVideo) sVideo.srcObject = null;
            }
        }

        async function toggleScreenShare() {
            const btn = document.getElementById('screenBtn');
            if (!isScreenSharing) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    isScreenSharing = true;
                    btn.innerText = "🛑 Стоп Екран";
                    btn.classList.add('btn-red');

                    handleRemoteScreenShare(myPeerId, true);

                    Object.values(calls).forEach(call => {
                        const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(screenStream.getVideoTracks()[0]);
                    });

                    const msg = { type: 'SCREEN_START', peerId: myPeerId };
                    if (isHost) broadcastToAll(msg);
                    else if (hostConn && hostConn.open) hostConn.send(msg);

                    screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
                } catch (e) {
                    alert("❌ Не вдалося запустити трансляцію екрана!");
                }
            } else {
                stopScreenShare();
            }
        }

        function stopScreenShare() {
            if (!isScreenSharing) return;
            isScreenSharing = false;
            const btn = document.getElementById('screenBtn');
            btn.innerText = "💻 Екран";
            btn.classList.remove('btn-red');

            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }

            handleRemoteScreenShare(myPeerId, false);

            Object.values(calls).forEach(call => {
                const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender && localStream) sender.replaceTrack(localStream.getVideoTracks()[0]);
            });

            const msg = { type: 'SCREEN_STOP', peerId: myPeerId };
            if (isHost) broadcastToAll(msg);
            else if (hostConn && hostConn.open) hostConn.send(msg);
        }

        function addVideoStream(id, stream, name) {
            if (document.getElementById('container-' + id)) return;
            const grid = document.getElementById('videoGrid');
            const sidebar = document.getElementById('screenSidebar');
            
            const container = document.createElement('div');
            container.className = 'video-container';
            if (id === myPeerId) container.classList.add('is-me');
            container.id = 'container-' + id;

            const video = document.createElement('video');
            video.id = 'video-' + id;
            video.autoplay = true;
            video.playsInline = true;
            if (stream) video.srcObject = stream;
            if (id === myPeerId) video.muted = true;

            const label = document.createElement('div');
            label.className = 'user-label';
            label.innerText = name;

            container.appendChild(video);
            container.appendChild(label);

            if (sidebar.classList.contains('active')) {
                sidebar.appendChild(container);
            } else {
                grid.appendChild(container);
            }
        }

        function removeUser(id) {
            const el = document.getElementById('container-' + id);
            if (el) el.remove();
            if (currentScreenSharerId === id) handleRemoteScreenShare(id, false);
            delete calls[id];
            delete clientConns[id];
            delete userNames[id];
        }

        function showCallScreen() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('waitingModal').style.display = 'none';
            document.getElementById('callRoom').style.display = 'flex';
        }

        function toggleMic() {
            isMicOn = !isMicOn;
            if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = isMicOn);
            const btn = document.getElementById('micBtn');
            btn.innerText = isMicOn ? "🎤 Мікр" : "🔇 Викл";
            btn.classList.toggle('btn-red', !isMicOn);
        }

        function toggleCam() {
            isCamOn = !isCamOn;
            if (localStream && !isScreenSharing) localStream.getVideoTracks().forEach(t => t.enabled = isCamOn);
            const btn = document.getElementById('camBtn');
            btn.innerText = isCamOn ? "📹 Камера" : "📷 Викл";
            btn.classList.toggle('btn-red', !isCamOn);
        }

        async function changeMediaDevices() {
            await getMedia();
            const myVideo = document.getElementById('video-' + myPeerId);
            if (myVideo && !isScreenSharing) myVideo.srcObject = localStream;
        }

        function cancelWaiting() {
            document.getElementById('waitingModal').style.display = 'none';
            if (peer) peer.destroy();
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        function leaveCall() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (screenStream) screenStream.getTracks().forEach(t => t.stop());
            if (peer) peer.destroy();
            window.location.reload();
        }
    </script>
</body>
</html>
