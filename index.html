<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IABG Meet - Відеодзвінки та Чат</title>
    
    <!-- Бібліотека PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #0d0e12;
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ЕКРАН ВХОДУ (ЛОБІ) */
        #lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }

        .card {
            background: #181922;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid #28293d;
        }

        h1 { margin-top: 0; color: #00a2ff; font-size: 28px; }
        p { color: #aaa; font-size: 14px; }

        input, button, select {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #333;
            font-size: 15px;
        }

        input, select { background: #222332; color: #fff; text-align: center; }

        button {
            background: #00a2ff;
            color: #fff;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #0084cc; }
        .btn-join { background: #00b06f; }
        .btn-join:hover { background: #008f5a; }

        #errorMsg {
            color: #ff4747;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        /* ОСНОВНА КІМНАТА ДЗВІНКУ */
        #callRoom {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #mainLayout {
            flex: 1;
            display: flex;
            height: calc(100vh - 75px);
            overflow: hidden;
            position: relative;
        }

        /* МОЗАЇКА ВІДЕО */
        #videoGrid {
            flex: 1;
            display: grid;
            gap: 16px;
            padding: 20px;
            background: #08090c;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            transition: all 0.3s ease-in-out;
            position: relative;
        }

        .video-container {
            position: relative;
            background: #181920;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            border: 3px solid transparent;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            
            /* Анімації появи та зміни розмірів */
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* РЕЖИМ «ФОКУС НА УЧАСНИКА» (ПОВНИЙ ЕКРАН ПРИ КЛІКУ) */
        #videoGrid.pinned-active .video-container {
            display: none !important;
        }

        #videoGrid.pinned-active .video-container.pinned {
            display: flex !important;
            grid-column: 1 / -1 !important;
            grid-row: 1 / -1 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 5;
        }

        #videoGrid.pinned-active .video-container.my-overlay {
            display: flex !important;
            position: absolute !important;
            bottom: 30px !important;
            right: 30px !important;
            width: 220px !important;
            height: 140px !important;
            z-index: 10 !important;
            border: 2px solid #00a2ff !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8) !important;
            border-radius: 14px !important;
        }

        /* БІЛЕ СЯЙВО ПРИ РОЗМОВІ */
        .video-container.speaking {
            border-color: #ffffff !important;
            box-shadow: 0 0 25px 6px rgba(255, 255, 255, 0.9) !important;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            user-select: none;
        }

        .user-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.75);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            z-index: 3;
            backdrop-filter: blur(4px);
        }

        /* БОКОВА ПАНЕЛЬ ЧАТУ */
        #chatSidebar {
            width: 320px;
            background: #14151f;
            border-left: 1px solid #28293d;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        #chatSidebar.hidden { display: none; }

        .chat-header {
            padding: 16px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #28293d;
            background: #181922;
        }

        #chatMessages {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-item {
            background: #222332;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            word-break: break-word;
        }

        .msg-item.mine { background: #005599; align-self: flex-end; }

        .msg-author {
            font-size: 11px;
            color: #00a2ff;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .msg-item.mine .msg-author { color: #7dd3ff; }

        .chat-input-box {
            padding: 12px;
            border-top: 1px solid #28293d;
            display: flex;
            gap: 8px;
            background: #181922;
        }

        .chat-input-box input { margin: 0; padding: 10px; font-size: 13px; text-align: left; }
        .chat-input-box button { width: auto; padding: 10px 16px; margin: 0; }

        /* МОДАЛЬНЕ ВІКНО НАЛАШТУВАНЬ ПРИСТРОЇВ */
        #settingsModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-body {
            background: #181922;
            padding: 24px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            border: 1px solid #28293d;
        }

        .modal-body label {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: #aaa;
            text-align: left;
        }

        /* ПАНЕЛЬ КЕРУВАННЯ */
        .controls {
            height: 75px;
            background: #181922;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 10px;
            border-top: 1px solid #28293d;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            width: auto;
            padding: 10px 16px;
            margin: 0;
            border-radius: 30px;
            font-size: 13px;
        }

        .btn-red { background: #ff4747; }
        .btn-red:hover { background: #cc3737; }
        .btn-gray { background: #33344a; }
        .btn-gray:hover { background: #444563; }
        .btn-blue { background: #00a2ff; }
        .btn-blue:hover { background: #0084cc; }
    </style>
</head>
<body>

    <!-- ЕКРАН ВХОДУ (ЛОБІ) -->
    <div id="lobby">
        <div class="card">
            <h1>IABG Meet 🎥</h1>
            <p>Введіть ваше ім'я та приєднайтеся до дзвінка</p>
            
            <input type="text" id="userNameInput" placeholder="Введіть ваше ім'я..." value="Гравець">

            <div style="margin: 10px 0; border-top: 1px solid #28293d;"></div>

            <button onclick="createRoom()">➕ Створити новий дзвінок</button>
            
            <div style="margin: 8px 0; color: #555; font-size: 12px;">— АБО —</div>
            
            <input type="text" id="roomInput" placeholder="Введіть код кімнати">
            <button class="btn-join" onclick="joinByInput()">Приєднатися</button>

            <div id="errorMsg"></div>
        </div>
    </div>

    <!-- КІМНАТА ДЗВІНКУ -->
    <div id="callRoom">
        <div id="mainLayout">
            <!-- ВІДЕО МОЗАЇКА -->
            <div id="videoGrid"></div>

            <!-- СПІЛЬНИЙ ЧАТ ДЛЯ ВСІХ -->
            <div id="chatSidebar">
                <div class="chat-header">💬 Чат кімнати</div>
                <div id="chatMessages"></div>
                <div class="chat-input-box">
                    <input type="text" id="msgInput" placeholder="Повідомлення..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                    <button class="btn-blue" onclick="sendChatMessage()">></button>
                </div>
            </div>
        </div>

        <!-- ПАНЕЛЬ КЕРУВАННЯ -->
        <div class="controls">
            <button class="ctrl-btn btn-gray" id="micBtn" onclick="toggleMic()">🎤 Мікрофон</button>
            <button class="ctrl-btn btn-gray" id="camBtn" onclick="toggleCam()">📹 Камера</button>
            <button class="ctrl-btn btn-gray" onclick="togglePiP()">📱 Picture-in-Picture</button>
            <button class="ctrl-btn btn-gray" onclick="openSettings()">⚙️ Пристрої</button>
            <button class="ctrl-btn btn-blue" onclick="toggleChat()">💬 Чат</button>
            <button class="ctrl-btn btn-gray" onclick="copyRoomLink()">🔗 Посилання</button>
            <button class="ctrl-btn btn-red" onclick="leaveCall()">📞 Завершити</button>
        </div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО НАЛАШТУВАНЬ МІКРОФОНА/КАМЕРИ -->
    <div id="settingsModal">
        <div class="modal-body">
            <h2 style="margin-top:0;">⚙️ Налаштування пристроїв</h2>
            
            <label>🎤 Мікрофон:</label>
            <select id="micSelect" onchange="changeAudioInput()"></select>

            <label>📹 Камера:</label>
            <select id="camSelect" onchange="changeVideoInput()"></select>

            <label>🔊 Динаміки / Навушники:</label>
            <select id="speakerSelect" onchange="changeAudioOutput()"></select>

            <button class="btn-blue" style="margin-top:20px;" onclick="closeSettings()">Закрити</button>
        </div>
    </div>

    <script>
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            }
        };

        let localStream;
        let peer;
        let myPeerId = "";
        let myName = "Гравець";
        let isHost = false;
        let isMicOn = true;
        let isCamOn = true;
        let roomIdGlobal = "";
        let pinnedPeerId = null;

        let hostConn = null; 
        const clientConns = {}; 
        const calls = {}; 
        const userCamStates = {}; 
        const userNames = {}; 

        // 🔊 СИНТЕЗАТОР ЗВУКОВИХ ЕФЕКТІВ (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'join') {
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'leave') {
                    osc.frequency.setValueAtTime(660, now);
                    osc.frequency.exponentialRampToValueAtTime(330, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'msg') {
                    osc.frequency.setValueAtTime(587.33, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'toggle') {
                    osc.frequency.setValueAtTime(300, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                }
            } catch (e) { console.log(e); }
        }

        window.onload = () => {
            const hashRoom = window.location.hash.substring(1);
            if (hashRoom) {
                document.getElementById('roomInput').value = hashRoom;
            }
            window.addEventListener('resize', updateMosaicLayout);
        };

        window.onbeforeunload = () => leaveCall();

        function showError(msg) { document.getElementById('errorMsg').innerText = msg; }
        function clearError() { document.getElementById('errorMsg').innerText = ""; }

        function getRandomColor(id) {
            let hash = 0;
            for (let i = 0; i < id.length; i++) {
                hash = id.charCodeAt(i) + ((hash << 5) - hash);
            }
            const h = Math.abs(hash) % 360;
            return `hsl(${h}, 65%, 40%)`;
        }

        function getUserNameInput() {
            const val = document.getElementById('userNameInput').value.trim();
            return val || "Гравець";
        }

        async function getMedia(audioId = null, videoId = null) {
            try {
                const constraints = {
                    audio: audioId ? { deviceId: { exact: audioId } } : true,
                    video: videoId ? { deviceId: { exact: videoId } } : true
                };

                const newStream = await navigator.mediaDevices.getUserMedia(constraints);

                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }

                localStream = newStream;

                // Замінюємо треки у всіх активних дзвінках
                Object.values(calls).forEach(call => {
                    const senders = call.peerConnection.getSenders();
                    const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                    const audioSender = senders.find(s => s.track && s.track.kind === 'audio');

                    if (videoSender && localStream.getVideoTracks()[0]) {
                        videoSender.replaceTrack(localStream.getVideoTracks()[0]);
                    }
                    if (audioSender && localStream.getAudioTracks()[0]) {
                        audioSender.replaceTrack(localStream.getAudioTracks()[0]);
                    }
                });

                const myVideo = document.getElementById('video-' + myPeerId);
                if (myVideo) myVideo.srcObject = localStream;

                return true;
            } catch (err) {
                showError("❌ Не вдалося отримати доступ до вибраного пристрою!");
                return false;
            }
        }

        function broadcastFromHost(msg, exceptPeerId = null) {
            Object.keys(clientConns).forEach(pId => {
                if (pId !== exceptPeerId && clientConns[pId] && clientConns[pId].open) {
                    clientConns[pId].send(msg);
                }
            });
        }

        // 1. СТВОРЕННЯ КІМНАТИ (ГОСПОДАР)
        async function createRoom() {
            clearError();
            if (!await getMedia()) return;

            myName = getUserNameInput();
            isHost = true;
            roomIdGlobal = 'meet-' + Math.random().toString(36).substring(2, 8);
            window.location.hash = roomIdGlobal;

            peer = new Peer(roomIdGlobal, peerConfig);

            peer.on('open', (id) => {
                myPeerId = id;
                userCamStates[myPeerId] = true;
                userNames[myPeerId] = myName + " (Господар)";

                showCallScreen();
                addVideoStream(myPeerId, localStream, userNames[myPeerId]);
            });

            peer.on('connection', (conn) => {
                conn.on('open', () => { clientConns[conn.peer] = conn; });
                conn.on('data', (data) => handleIncomingData(data, conn.peer));
                conn.on('close', () => handleUserLeave(conn.peer));
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                handleCallStream(call);
            });

            peer.on('error', (err) => showError("❌ Помилка сервера: " + err.type));
        }

        // 2. ПРИЄДНАННЯ ДО КІМНАТИ (ГОСТІ)
        function joinByInput() {
            clearError();
            const rId = document.getElementById('roomInput').value.trim();
            if (!rId) return showError("❌ Введіть код або посилання!");
            joinRoom(rId);
        }

        async function joinRoom(rId) {
            clearError();
            if (!await getMedia()) return;

            myName = getUserNameInput();
            roomIdGlobal = rId;
            peer = new Peer(peerConfig);

            peer.on('open', (id) => {
                myPeerId = id;
                isHost = false;
                userCamStates[myPeerId] = true;
                userNames[myPeerId] = myName;

                showCallScreen();
                addVideoStream(myPeerId, localStream, myName + " (Ви)");

                hostConn = peer.connect(roomIdGlobal);

                hostConn.on('open', () => {
                    hostConn.send({
                        type: 'JOIN_REQ',
                        peerId: myPeerId,
                        name: myName
                    });
                });

                hostConn.on('data', (data) => handleIncomingData(data, roomIdGlobal));

                peer.on('call', (call) => {
                    call.answer(localStream);
                    handleCallStream(call);
                });
            });

            peer.on('error', () => showError("❌ Не вдалося підключитися до кімнати!"));
        }

        // ОБРОБКА ВХІДНИХ ДАНИХ
        function handleIncomingData(data, senderPeerId) {
            if (data.type === 'JOIN_REQ' && isHost) {
                userNames[data.peerId] = data.name;
                userCamStates[data.peerId] = true;

                clientConns[data.peerId].send({
                    type: 'ROOM_STATE',
                    peers: Object.keys(userNames),
                    names: userNames,
                    camStates: userCamStates
                });

                broadcastFromHost({
                    type: 'USER_JOINED',
                    peerId: data.peerId,
                    name: data.name
                }, data.peerId);

                playSound('join');

            } else if (data.type === 'ROOM_STATE') {
                Object.assign(userNames, data.names);
                Object.assign(userCamStates, data.camStates);

                data.peers.forEach(pId => {
                    if (pId !== myPeerId) callPeer(pId);
                });
                playSound('join');

            } else if (data.type === 'USER_JOINED') {
                userNames[data.peerId] = data.name;
                userCamStates[data.peerId] = true;
                playSound('join');

            } else if (data.type === 'CAM_STATE') {
                userCamStates[data.peerId] = data.enabled;
                setCamDisplay(data.peerId, data.enabled);
                if (isHost) broadcastFromHost(data, senderPeerId);

            } else if (data.type === 'CHAT_MSG') {
                appendChatMessage(data.senderName, data.text, data.senderId === myPeerId);
                playSound('msg');
                if (isHost) broadcastFromHost(data, senderPeerId);

            } else if (data.type === 'LEAVE') {
                removeVideoStream(data.peerId);
                delete userCamStates[data.peerId];
                delete userNames[data.peerId];
                playSound('leave');

                if (isHost) {
                    delete clientConns[data.peerId];
                    broadcastFromHost(data, senderPeerId);
                }
            }
        }

        function callPeer(targetPeerId) {
            if (!targetPeerId || targetPeerId === myPeerId || calls[targetPeerId]) return;
            const call = peer.call(targetPeerId, localStream);
            handleCallStream(call, targetPeerId);
        }

        function handleCallStream(call, fallbackId) {
            const peerId = call.peer || fallbackId;
            if (!peerId) return;

            if (calls[peerId]) calls[peerId].close();
            calls[peerId] = call;

            call.on('stream', (remoteStream) => {
                const label = userNames[peerId] || ('Учасник (' + peerId.substring(0, 4) + ')');
                addVideoStream(peerId, remoteStream, label);
            });

            call.on('close', () => removeVideoStream(peerId));
        }

        // ДОДАВАННЯ ТА ОНОВЛЕННЯ ВІДЕО В МОЗАЇЦІ
        function addVideoStream(peerId, stream, labelText) {
            let container = document.getElementById('container-' + peerId);

            if (!container) {
                const grid = document.getElementById('videoGrid');
                container = document.createElement('div');
                container.className = 'video-container';
                container.id = 'container-' + peerId;

                // Клік по людині розгортає її на весь екран
                container.onclick = () => togglePinUser(peerId);

                const avatar = document.createElement('div');
                avatar.className = 'avatar-placeholder';
                avatar.id = 'avatar-' + peerId;
                avatar.style.background = getRandomColor(peerId);
                avatar.innerHTML = `<div class="avatar-circle">👤</div>`;

                const video = document.createElement('video');
                video.id = 'video-' + peerId;
                video.srcObject = stream;
                video.autoplay = true;
                video.playsInline = true;
                if (peerId === myPeerId) video.muted = true;

                const label = document.createElement('div');
                label.className = 'user-label';
                label.id = 'label-' + peerId;
                label.innerText = labelText;

                container.appendChild(avatar);
                container.appendChild(video);
                container.appendChild(label);
                grid.appendChild(container);

                setupVoiceDetection(stream, container.id);
            } else {
                const video = document.getElementById('video-' + peerId);
                if (video) video.srcObject = stream;
                const label = document.getElementById('label-' + peerId);
                if (label) label.innerText = labelText;
            }

            const isCamEnabled = userCamStates[peerId] !== undefined ? userCamStates[peerId] : true;
            setCamDisplay(peerId, isCamEnabled);
            updateMosaicLayout();
        }

        // РЕЖИМ «ФОКУС НА УЧАСНИКА» ПРИ КЛІКУ
        function togglePinUser(peerId) {
            const grid = document.getElementById('videoGrid');

            if (pinnedPeerId === peerId) {
                // Знімаємо фокус
                pinnedPeerId = null;
                grid.classList.remove('pinned-active');
                document.querySelectorAll('.video-container').forEach(c => {
                    c.classList.remove('pinned', 'my-overlay');
                });
            } else {
                // Ставимо фокус на вибрану людину
                pinnedPeerId = peerId;
                grid.classList.add('pinned-active');

                document.querySelectorAll('.video-container').forEach(c => {
                    c.classList.remove('pinned', 'my-overlay');
                });

                const targetContainer = document.getElementById('container-' + peerId);
                if (targetContainer) targetContainer.classList.add('pinned');

                // Моє вікно розміщується в кутку поверх
                const myContainer = document.getElementById('container-' + myPeerId);
                if (myContainer && myPeerId !== peerId) {
                    myContainer.classList.add('my-overlay');
                }
            }
            playSound('toggle');
            updateMosaicLayout();
        }

        // АДАПТИВНА МОЗАЇКА
        function updateMosaicLayout() {
            if (pinnedPeerId) return;

            const grid = document.getElementById('videoGrid');
            const count = grid.children.length;

            if (count <= 1) {
                grid.style.gridTemplateColumns = '1fr';
                grid.style.gridTemplateRows = '1fr';
            } else if (count === 2) {
                if (window.innerWidth > 700) {
                    grid.style.gridTemplateColumns = '1fr 1fr';
                    grid.style.gridTemplateRows = '1fr';
                } else {
                    grid.style.gridTemplateColumns = '1fr';
                    grid.style.gridTemplateRows = '1fr 1fr';
                }
            } else if (count <= 4) {
                grid.style.gridTemplateColumns = '1fr 1fr';
                grid.style.gridTemplateRows = '1fr 1fr';
            } else if (count <= 6) {
                grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
                grid.style.gridTemplateRows = 'repeat(2, 1fr)';
            } else {
                grid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(220px, 1fr))';
                grid.style.gridTemplateRows = 'repeat(auto-fit, minmax(160px, 1fr))';
            }
        }

        function setCamDisplay(peerId, isEnabled) {
            const videoEl = document.getElementById('video-' + peerId);
            if (videoEl) videoEl.style.display = isEnabled ? 'block' : 'none';
        }

        // PICTURE-IN-PICTURE (ПЛАВАЮЧЕ ВІКНО)
        async function togglePiP() {
            try {
                const targetId = pinnedPeerId || myPeerId;
                const video = document.getElementById('video-' + targetId);

                if (!video) return alert("❌ Немає відео для Picture-in-Picture!");

                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await video.requestPictureInPicture();
                }
            } catch (err) {
                alert("❌ Picture-in-Picture не підтримується на цьому браузері або пристрої.");
            }
        }

        // МЕНЮ НАЛАШТУВАНЬ КАМЕРИ ТА МІКРОФОНА
        async function openSettings() {
            const modal = document.getElementById('settingsModal');
            modal.style.display = 'flex';

            const devices = await navigator.mediaDevices.enumerateDevices();

            const micSelect = document.getElementById('micSelect');
            const camSelect = document.getElementById('camSelect');
            const speakerSelect = document.getElementById('speakerSelect');

            micSelect.innerHTML = '';
            camSelect.innerHTML = '';
            speakerSelect.innerHTML = '';

            devices.forEach(device => {
                const opt = document.createElement('option');
                opt.value = device.deviceId;
                opt.text = device.label || `${device.kind} (${device.deviceId.substring(0, 5)})`;

                if (device.kind === 'audioinput') micSelect.appendChild(opt);
                else if (device.kind === 'videoinput') camSelect.appendChild(opt);
                else if (device.kind === 'audiooutput') speakerSelect.appendChild(opt);
            });
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        async function changeAudioInput() {
            const id = document.getElementById('micSelect').value;
            await getMedia(id, document.getElementById('camSelect').value);
        }

        async function changeVideoInput() {
            const id = document.getElementById('camSelect').value;
            await getMedia(document.getElementById('micSelect').value, id);
        }

        async function changeAudioOutput() {
            const id = document.getElementById('speakerSelect').value;
            const videos = document.querySelectorAll('video');

            videos.forEach(v => {
                if (typeof v.setSinkId === 'function') {
                    v.setSinkId(id);
                }
            });
        }

        // СНІПЕТ ЧАТУ
        function sendChatMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            const msgData = {
                type: 'CHAT_MSG',
                senderId: myPeerId,
                senderName: myName,
                text: text
            };

            appendChatMessage(myName, text, true);
            playSound('msg');

            if (isHost) broadcastFromHost(msgData);
            else if (hostConn && hostConn.open) hostConn.send(msgData);

            input.value = '';
        }

        function appendChatMessage(author, text, isMine) {
            const box = document.getElementById('chatMessages');
            const item = document.createElement('div');
            item.className = 'msg-item' + (isMine ? ' mine' : '');

            const authorEl = document.createElement('div');
            authorEl.className = 'msg-author';
            authorEl.innerText = isMine ? 'Ви' : author;

            const textEl = document.createElement('div');
            textEl.innerText = text;

            item.appendChild(authorEl);
            item.appendChild(textEl);
            box.appendChild(item);
            box.scrollTop = box.scrollHeight;
        }

        function toggleChat() {
            const sidebar = document.getElementById('chatSidebar');
            sidebar.classList.toggle('hidden');
            playSound('toggle');
            updateMosaicLayout();
        }

        // ДЕТЕКТОР ГОЛОСУ
        function setupVoiceDetection(stream, containerId) {
            try {
                if (stream.getAudioTracks().length === 0) return;

                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function checkVolume() {
                    const container = document.getElementById(containerId);
                    if (!container) return;

                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    let average = sum / dataArray.length;

                    if (average > 15) {
                        container.classList.add('speaking');
                    } else {
                        container.classList.remove('speaking');
                    }

                    requestAnimationFrame(checkVolume);
                }
                checkVolume();
            } catch (e) { console.log("Voice error:", e); }
        }

        function handleUserLeave(peerId) {
            removeVideoStream(peerId);
            delete userCamStates[peerId];
            delete userNames[peerId];
            delete clientConns[peerId];
            broadcastFromHost({ type: 'LEAVE', peerId: peerId });
        }

        function removeVideoStream(peerId) {
            if (pinnedPeerId === peerId) togglePinUser(peerId);

            const container = document.getElementById('container-' + peerId);
            if (container) container.remove();
            if (calls[peerId]) {
                calls[peerId].close();
                delete calls[peerId];
            }
            updateMosaicLayout();
        }

        function showCallScreen() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('callRoom').style.display = 'flex';
        }

        function copyRoomLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("🔗 Посилання скопійовано! Надішли його друзям.");
        }

        function toggleMic() {
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            const btn = document.getElementById('micBtn');
            btn.innerText = isMicOn ? "🎤 Мікрофон" : "🔇 Мікрофон (Вимк)";
            btn.style.background = isMicOn ? "#33344a" : "#ff4747";
            playSound('toggle');
        }

        function toggleCam() {
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;

            userCamStates[myPeerId] = isCamOn;
            setCamDisplay(myPeerId, isCamOn);

            const msg = { type: 'CAM_STATE', peerId: myPeerId, enabled: isCamOn };
            if (isHost) broadcastFromHost(msg);
            else if (hostConn && hostConn.open) hostConn.send(msg);

            const btn = document.getElementById('camBtn');
            btn.innerText = isCamOn ? "📹 Камера" : "📷 Камера (Вимк)";
            btn.style.background = isCamOn ? "#33344a" : "#ff4747";
            playSound('toggle');
        }

        function leaveCall() {
            playSound('leave');
            const msg = { type: 'LEAVE', peerId: myPeerId };
            if (isHost) broadcastFromHost(msg);
            else if (hostConn && hostConn.open) hostConn.send(msg);

            if (localStream) localStream.getTracks().forEach(track => track.stop());
            if (peer) peer.destroy();
            window.location.hash = "";
            location.reload();
        }
    </script>
</body>
</html>
