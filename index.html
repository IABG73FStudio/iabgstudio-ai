<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IABG Meet</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel2: #232733;
    --accent: #4a7dff;
    --accent2: #3a63d4;
    --danger: #e5484d;
    --text: #e8eaed;
    --muted: #8b91a0;
    --tile: 280px;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }

  /* ---------- ЭКРАН ИМЕНИ ---------- */
  #nameScreen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1b2130, #0b0d12 70%);
    z-index: 100;
  }
  .nameCard {
    background: var(--panel);
    padding: 40px;
    border-radius: 20px;
    width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    text-align: center;
  }
  .nameCard h1 { font-size: 28px; margin-bottom: 8px; letter-spacing: -.5px; }
  .nameCard p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .nameCard input {
    width: 100%;
    padding: 14px 16px;
    background: var(--panel2);
    border: 1px solid #2e3341;
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    margin-bottom: 12px;
  }
  .nameCard input:focus { border-color: var(--accent); }
  .nameCard button {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
  }
  .nameCard button:hover { background: var(--accent2); }

  /* ---------- МЕНЮ ---------- */
  #menu {
    display: none;
    min-height: 100vh;
    padding: 40px 20px;
    overflow-y: auto;
  }
  .menuWrap { max-width: 880px; margin: 0 auto; }
  .menuHead {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 36px;
  }
  .logo {
    font-size: 26px; font-weight: 700; letter-spacing: -.5px;
  }
  .logo span { color: var(--accent); }
  .userChip {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); padding: 8px 14px; border-radius: 999px;
    font-size: 14px;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 13px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid #232733;
    border-radius: 16px;
    padding: 24px;
    cursor: pointer;
    transition: .15s;
  }
  .card:hover { background: var(--panel2); border-color: #2e3341; transform: translateY(-2px); }
  .card .ic { font-size: 28px; margin-bottom: 12px; }
  .card h3 { font-size: 16px; margin-bottom: 6px; }
  .card p { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .joinRow { display: flex; gap: 10px; margin-top: 14px; }
  .joinRow input {
    flex: 1; padding: 10px 12px; background: var(--panel2);
    border: 1px solid #2e3341; border-radius: 8px;
    color: var(--text); font-size: 14px; outline: none;
  }
  .joinRow button {
    padding: 10px 18px; background: var(--accent); border: none;
    border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer;
  }
  .joinRow button:hover { background: var(--accent2); }

  /* ---------- КОНФЕРЕНЦИЯ ---------- */
  #conf {
    display: none;
    position: fixed; inset: 0;
    flex-direction: column;
    background: #000;
  }
  #confTop {
    padding: 10px 16px;
    background: var(--panel);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #232733;
    font-size: 14px;
  }
  #confTop .roomId { color: var(--muted); }
  #confTop .roomId b { color: var(--text); }
  #stage {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(var(--tile), 1fr));
    grid-auto-rows: min-content;
    gap: 10px;
    padding: 12px;
    overflow-y: auto;
    align-content: start;
  }
  #stage.mosaic { grid-template-columns: repeat(auto-fit, minmax(var(--tile), 1fr)); }
  #stage.spotlight { grid-template-columns: 1fr; }

  .tile {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #0a0a0a;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: .15s;
  }
  .tile.speaking { border-color: var(--accent); }
  .tile video {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .tile .label {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(0,0,0,.65);
    padding: 4px 10px; border-radius: 8px;
    font-size: 12px; display: flex; align-items: center; gap: 6px;
    backdrop-filter: blur(6px);
  }
  .tile .micIc { font-size: 12px; }
  .tile .micIc.off { color: var(--danger); }
  .tile .hostBadge {
    position: absolute; top: 8px; left: 8px;
    background: var(--accent); color: #fff;
    padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600;
  }
  .tile .camOff {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #15171c; color: var(--muted); font-size: 40px;
  }

  /* ---------- НИЖНЯЯ ПАНЕЛЬ ---------- */
  #confBar {
    padding: 14px;
    background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    border-top: 1px solid #232733;
    flex-wrap: wrap;
  }
  .cbtn {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--panel2);
    border: none; color: var(--text);
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: .15s;
  }
  .cbtn:hover { background: #2e3341; }
  .cbtn.off { background: var(--danger); color: #fff; }
  .cbtn.leave { background: var(--danger); width: 66px; border-radius: 26px; }
  .cbtn.leave:hover { background: #c93b3f; }
  .cbtn.wide { width: auto; padding: 0 18px; border-radius: 26px; gap: 8px; font-size: 14px; }

  /* ---------- ЧАТ ---------- */
  #chat {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 340px;
    background: var(--panel);
    border-left: 1px solid #232733;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .25s;
    z-index: 50;
  }
  #chat.open { transform: translateX(0); }
  #chat .head {
    padding: 16px; border-bottom: 1px solid #232733;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600;
  }
  #chat .head button {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer;
  }
  #chatMsgs {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { font-size: 14px; line-height: 1.4; }
  .msg .who { color: var(--accent); font-weight: 600; font-size: 12px; }
  .msg .txt { color: var(--text); word-break: break-word; }
  .msg.system { color: var(--muted); font-size: 12px; font-style: italic; text-align: center; }
  #chatInput {
    padding: 12px; border-top: 1px solid #232733;
    display: flex; gap: 8px;
  }
  #chatInput input {
    flex: 1; padding: 10px 12px; background: var(--panel2);
    border: 1px solid #2e3341; border-radius: 8px;
    color: var(--text); outline: none; font-size: 14px;
  }
  #chatInput button {
    padding: 10px 16px; background: var(--accent); border: none;
    border-radius: 8px; color: #fff; cursor: pointer; font-weight: 600;
  }

  /* ---------- КОНТЕКСТНОЕ МЕНЮ ---------- */
  #ctx {
    position: fixed; z-index: 200;
    background: var(--panel2);
    border: 1px solid #2e3341;
    border-radius: 10px;
    padding: 6px;
    min-width: 200px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    display: none;
  }
  #ctx button {
    width: 100%; text-align: left;
    padding: 10px 12px; background: none; border: none;
    color: var(--text); cursor: pointer; border-radius: 6px;
    font-size: 14px;
  }
  #ctx button:hover { background: #2e3341; }
  #ctx button.danger { color: var(--danger); }

  /* ---------- МОДАЛКА УСТРОЙСТВ ---------- */
  #devices {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center;
  }
  #devices.open { display: flex; }
  .devCard {
    background: var(--panel); padding: 28px; border-radius: 16px;
    width: 400px; max-width: 90vw;
  }
  .devCard h2 { margin-bottom: 20px; font-size: 18px; }
  .devCard label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
  .devCard select {
    width: 100%; padding: 10px; background: var(--panel2);
    border: 1px solid #2e3341; border-radius: 8px;
    color: var(--text); font-size: 14px; outline: none;
  }
  .devCard .close {
    margin-top: 20px; width: 100%; padding: 12px;
    background: var(--accent); border: none; border-radius: 8px;
    color: #fff; font-weight: 600; cursor: pointer;
  }

  /* ---------- TOAST ---------- */
  #toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); padding: 12px 20px; border-radius: 10px;
    font-size: 14px; z-index: 400; opacity: 0; transition: .25s;
    pointer-events: none;
    border: 1px solid #2e3341;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ================= ЭКРАН ИМЕНИ ================= -->
<div id="nameScreen">
  <div class="nameCard">
    <h1>IABG <span style="color:var(--accent)">Meet</span></h1>
    <p>Введи имя, чтобы продолжить</p>
    <input id="nameInput" placeholder="Твоё имя" maxlength="24" autofocus>
    <button id="nameGo">Продолжить</button>
  </div>
</div>

<!-- ================= МЕНЮ ================= -->
<div id="menu">
  <div class="menuWrap">
    <div class="menuHead">
      <div class="logo">IABG <span>Meet</span></div>
      <div class="userChip">
        <div class="avatar" id="menuAvatar">?</div>
        <span id="menuName">—</span>
        <button onclick="resetUser()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;">сменить</button>
      </div>
    </div>

    <div class="grid">
      <div class="card" onclick="createRoom()">
        <div class="ic">➕</div>
        <h3>Создать комнату</h3>
        <p>Новая конференция. Ты — хост.</p>
      </div>

      <div class="card" style="cursor:default;">
        <div class="ic">🔑</div>
        <h3>Войти по ID</h3>
        <p>Введи код комнаты</p>
        <div class="joinRow">
          <input id="joinCode" placeholder="abc123" maxlength="12">
          <button onclick="joinById()">Войти</button>
        </div>
      </div>

      <div class="card" onclick="copyInvite()">
        <div class="ic">🔗</div>
        <h3>Пригласить</h3>
        <p>Скопировать ссылку-приглашение</p>
      </div>

      <div class="card" onclick="toast('Друзья появятся, когда будет сервер 😉')">
        <div class="ic">👥</div>
        <h3>Друзья</h3>
        <p>Скоро (нужен бэкенд)</p>
      </div>
    </div>
  </div>
</div>

<!-- ================= КОНФЕРЕНЦИЯ ================= -->
<div id="conf">
  <div id="confTop">
    <div class="roomId">Комната: <b id="roomLabel">—</b></div>
    <div style="display:flex;gap:8px;">
      <button class="cbtn wide" onclick="toggleMosaic()" id="layoutBtn">▦ Мозаика</button>
      <button class="cbtn wide" onclick="copyInvite()">🔗 Пригласить</button>
    </div>
  </div>

  <div id="stage" class="mosaic"></div>

  <div id="confBar">
    <button class="cbtn" id="btnMic" onclick="toggleMic()" title="Микрофон">🎤</button>
    <button class="cbtn" id="btnCam" onclick="toggleCam()" title="Камера">📷</button>
    <button class="cbtn" onclick="openDevices()" title="Устройства">⚙️</button>
    <button class="cbtn" onclick="toggleChat()" title="Чат">💬</button>
    <button class="cbtn leave" onclick="leaveRoom()" title="Выйти">🚪</button>
  </div>
</div>

<!-- ================= ЧАТ ================= -->
<div id="chat">
  <div class="head">
    <span>Чат конференции</span>
    <button onclick="toggleChat()">×</button>
  </div>
  <div id="chatMsgs"></div>
  <div id="chatInput">
    <input id="chatText" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">→</button>
  </div>
</div>

<!-- ================= КОНТЕКСТНОЕ МЕНЮ ================= -->
<div id="ctx"></div>

<!-- ================= УСТРОЙСТВА ================= -->
<div id="devices">
  <div class="devCard">
    <h2>Устройства</h2>
    <label>Камера</label>
    <select id="devCam"></select>
    <label>Микрофон</label>
    <select id="devMic"></select>
    <label>Динамики</label>
    <select id="devSpk"></select>
    <button class="close" onclick="closeDevices()">Готово</button>
  </div>
</div>

<!-- ================= TOAST ================= -->
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* =========================================================
   IABG Meet — один HTML, WebRTC mesh через PeerJS
   ========================================================= */

const params = new URLSearchParams(location.search);
let room = params.get('room') || null;
let myName = localStorage.getItem('iabg_name') || '';
let myId = null;                 // PeerJS id
let isHost = false;
let localStream = null;
let peer = null;
const conns = {};                // peerId -> DataConnection
const calls = {};                // peerId -> MediaConnection
const meta = {};                 // peerId -> { name, mic, cam, isHost, blocked }
let micOn = true, camOn = true;
let layout = 'mosaic';           // mosaic | spotlight
let chatOpen = false;
let blockedChat = false;         // меня заблокировал хост

/* ---------- УТИЛИТЫ ---------- */
const $ = id => document.getElementById(id);
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function initials(name) {
  return (name || '?').trim().slice(0, 1).toUpperCase();
}

/* ---------- ЭКРАН ИМЕНИ ---------- */
if (myName) {
  $('nameInput').value = myName;
}
$('nameGo').onclick = () => {
  const v = $('nameInput').value.trim();
  if (!v) return toast('Введи имя');
  myName = v;
  localStorage.setItem('iabg_name', v);
  enterMenu();
};
$('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('nameGo').click();
});

function enterMenu() {
  $('nameScreen').style.display = 'none';
  $('menu').style.display = 'block';
  $('menuName').textContent = myName;
  $('menuAvatar').textContent = initials(myName);

  // если в URL есть ?room= — сразу в конференцию
  if (room) {
    startConference(room, false);
  }
}

function resetUser() {
  localStorage.removeItem('iabg_name');
  location.href = location.pathname;
}

/* ---------- МЕНЮ ---------- */
function createRoom() {
  const id = Math.random().toString(36).slice(2, 8);
  startConference(id, true);
}
function joinById() {
  const code = $('joinCode').value.trim().toLowerCase();
  if (!code) return toast('Введи код');
  startConference(code, false);
}
function copyInvite() {
  const url = location.origin + location.pathname + '?room=' + room;
  navigator.clipboard.writeText(url);
  toast('Ссылка скопирована');
}

/* =========================================================
   КОНФЕРЕНЦИЯ
   ========================================================= */
async function startConference(roomId, host) {
  room = roomId;
  isHost = host;
  $('menu').style.display = 'none';
  $('conf').style.display = 'flex';
  $('roomLabel').textContent = room;

  // обновим URL (без перезагрузки)
  const p = new URLSearchParams(location.search);
  p.set('room', room);
  history.replaceState(null, '', location.pathname + '?' + p.toString());

  // 1. локальный поток
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720 },
      audio: true
    });
  } catch (e) {
    toast('Нет доступа к камере/микрофону');
    return;
  }

  addTile('me', localStream, myName, true);

  // 2. PeerJS
  //    хост занимает ID: iabg-<room>-host
  //    гость: iabg-<room>-<random>
  const hostId = 'iabg-' + room + '-host';
  if (isHost) {
    peer = new Peer(hostId, {
      debug: 1,
      config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
    });
    peer.on('open', id => { myId = id; });
    peer.on('connection', onIncomingConn);
    peer.on('call', onIncomingCall);
    peer.on('error', e => console.warn('host err', e));
    addSystemMsg('Ты создал комнату. Ждём участников...');
  } else {
    // гость: сначала пробует подключиться к хосту
    peer = new Peer({
      debug: 1,
      config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
    });
    peer.on('open', id => {
      myId = id;
      // подключаемся к хосту
      const conn = peer.connect(hostId, { reliable: true });
      conn.on('open', () => {
        setupConn(conn);
        addSystemMsg('Подключено к комнате');
        // звоним хосту
        const call = peer.call(hostId, localStream, { metadata: { name: myName } });
        if (call) bindCall(call);
      });
      conn.on('error', () => {
        toast('Комната не найдена');
        leaveRoom();
      });
    });
    peer.on('connection', onIncomingConn);
    peer.on('call', onIncomingCall);
    peer.on('error', e => console.warn('guest err', e));
  }

  // обновляем иконку микро
  updateMicIcon();
}

/* ---------- ВХОДЯЩИЕ ---------- */
function onIncomingConn(conn) {
  setupConn(conn);
}
function onIncomingCall(call) {
  call.answer(localStream);
  bindCall(call);
  // хост при новом участнике — рассылает всем остальным информацию о нём
}

/* ---------- DATA CONNECTION ---------- */
function setupConn(conn) {
  conns[conn.peer] = conn;

  // представимся
  conn.on('open', () => {
    conn.send({
      type: 'hello',
      name: myName,
      mic: micOn,
      cam: camOn,
      isHost: isHost
    });
    // если я хост — скажу новому позвонить остальным
    if (isHost) {
      const others = Object.keys(conns).filter(id => id !== conn.peer);
      conn.send({ type: 'peers', peers: others, hostId: myId });
    }
  });

  conn.on('data', msg => handleMsg(conn.peer, msg));

  conn.on('close', () => {
    removeTile(conn.peer);
    calls[conn.peer]?.close();
    delete conns[conn.peer];
    delete calls[conn.peer];
    delete meta[conn.peer];
    addSystemMsg((meta[conn.peer]?.name || 'Участник') + ' вышел');
  });
}

function handleMsg(fromId, msg) {
  if (!msg || !msg.type) return;
  switch (msg.type) {
    case 'hello':
      meta[fromId] = meta[fromId] || {};
      meta[fromId].name = msg.name;
      meta[fromId].mic = msg.mic;
      meta[fromId].cam = msg.cam;
      meta[fromId].isHost = msg.isHost;
      updateTileLabel(fromId);
      addSystemMsg(msg.name + ' присоединился');
      // если я не хост, а пришёл хост — запомню
      break;

    case 'peers':
      // хост прислал список других участников — звоним им
      msg.peers.forEach(pid => {
        if (pid === myId || calls[pid]) return;
        const c = peer.call(pid, localStream, { metadata: { name: myName } });
        if (c) bindCall(c);
        // и data-канал
        const dc = peer.connect(pid, { reliable: true });
        dc.on('open', () => setupConn(dc));
      });
      break;

    case 'mic':
      if (meta[fromId]) meta[fromId].mic = msg.on;
      updateMicIcon(fromId, msg.on);
      break;

    case 'cam':
      if (meta[fromId]) meta[fromId].cam = msg.on;
      updateCamVisibility(fromId, msg.on);
      break;

    case 'chat':
      addChatMsg(meta[fromId]?.name || 'Аноним', msg.text, false);
      break;

    case 'kick':
      toast('Тебя кикнул хост');
      setTimeout(leaveRoom, 800);
      break;

    case 'block-chat':
      blockedChat = msg.on;
      toast(msg.on ? 'Хост заблокировал тебе чат' : 'Чат разблокирован');
      $('chatText').disabled = msg.on;
      break;

    case 'mute-force':
      micOn = false;
      localStream.getAudioTracks().forEach(t => t.enabled = false);
      $('btnMic').classList.add('off');
      broadcast({ type: 'mic', on: false });
      toast('Хост выключил тебе микрофон');
      break;
  }
}

function broadcast(msg) {
  Object.values(conns).forEach(c => { try { c.send(msg); } catch(e){} });
}

/* ---------- MEDIA ---------- */
function bindCall(call) {
  calls[call.peer] = call;
  call.on('stream', remote => {
    addTile(call.peer, remote, meta[call.peer]?.name || 'Участник');
  });
  call.on('close', () => {
    removeTile(call.peer);
    delete calls[call.peer];
  });
}

/* ---------- ПЛИТКИ ---------- */
function addTile(id, stream, name, muted=false) {
  let t = document.getElementById('t-' + id);
  if (!t) {
    t = document.createElement('div');
    t.className = 'tile';
    t.id = 't-' + id;
    t.innerHTML = `
      <video autoplay playsinline ${muted ? 'muted' : ''}></video>
      <div class="camOff" style="display:none">📷</div>
      <div class="label">
        <span class="micIc">🎤</span>
        <span class="nm"></span>
      </div>
      ${id !== 'me' ? '<div class="hostBadge" style="display:none">HOST</div>' : ''}
    `;
    $('stage').appendChild(t);

    // контекстное меню (для всех, кроме себя)
    if (id !== 'me') {
      t.addEventListener('contextmenu', e => {
        e.preventDefault();
        if (!isHost) return toast('Только хост может это');
        showCtx(e.clientX, e.clientY, id);
      });
    }
  }
  t.querySelector('video').srcObject = stream;
  t.querySelector('.nm').textContent = name;
  if (meta[id]?.isHost) t.querySelector('.hostBadge').style.display = 'block';
}

function removeTile(id) {
  document.getElementById('t-' + id)?.remove();
}

function updateTileLabel(id) {
  const t = document.getElementById('t-' + id);
  if (!t) return;
  t.querySelector('.nm').textContent = meta[id]?.name || 'Участник';
  if (meta[id]?.isHost) {
    const b = t.querySelector('.hostBadge');
    if (b) b.style.display = 'block';
  }
  updateMicIcon(id, meta[id]?.mic);
  updateCamVisibility(id, meta[id]?.cam);
}

function updateMicIcon(id, on) {
  const t = document.getElementById('t-' + id);
  if (!t) return;
  const ic = t.querySelector('.micIc');
  ic.textContent = on ? '🎤' : '🔇';
  ic.classList.toggle('off', !on);
  if (id === 'me') {
    $('btnMic').classList.toggle('off', !on);
    $('btnMic').textContent = on ? '🎤' : '🔇';
  }
}

function updateCamVisibility(id, on) {
  const t = document.getElementById('t-' + id);
  if (!t) return;
  const off = t.querySelector('.camOff');
  const v = t.querySelector('video');
  off.style.display = on ? 'none' : 'flex';
  v.style.visibility = on ? 'visible' : 'hidden';
  if (id === 'me') {
    $('btnCam').classList.toggle('off', !on);
  }
}

function updateMicIcon() { /* заглушка */ }

/* ---------- КНОПКИ ---------- */
function toggleMic() {
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  updateMicIcon('me', micOn);
  broadcast({ type: 'mic', on: micOn });
}
function toggleCam() {
  camOn = !camOn;
  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  updateCamVisibility('me', camOn);
  broadcast({ type: 'cam', on: camOn });
}
function toggleChat() {
  chatOpen = !chatOpen;
  $('chat').classList.toggle('open', chatOpen);
}
function toggleMosaic() {
  layout = layout === 'mosaic' ? 'spotlight' : 'mosaic';
  $('stage').className = layout;
  $('layoutBtn').textContent = layout === 'mosaic' ? '▦ Мозаика' : '🔲 Один';
}
function leaveRoom() {
  Object.values(calls).forEach(c => c.close());
  Object.values(conns).forEach(c => c.close());
  if (peer) peer.destroy();
  localStream?.getTracks().forEach(t => t.stop());
  const p = new URLSearchParams(location.search);
  p.delete('room');
  location.href = location.pathname + (p.toString() ? '?' + p.toString() : '');
}

/* ---------- ЧАТ ---------- */
function sendChat() {
  if (blockedChat) return;
  const txt = $('chatText').value.trim();
  if (!txt) return;
  addChatMsg(myName, txt, true);
  broadcast({ type: 'chat', text: txt });
  $('chatText').value = '';
}
function addChatMsg(who, text, me) {
  const d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = `<div class="who">${escapeHtml(who)}${me ? ' (ты)' : ''}</div><div class="txt">${escapeHtml(text)}</div>`;
  $('chatMsgs').appendChild(d);
  $('chatMsgs').scrollTop = $('chatMsgs').scrollHeight;
}
function addSystemMsg(text) {
  const d = document.createElement('div');
  d.className = 'msg system';
  d.textContent = text;
  $('chatMsgs').appendChild(d);
  $('chatMsgs').scrollTop = $('chatMsgs').scrollHeight;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- КОНТЕКСТНОЕ МЕНЮ (хост) ---------- */
function showCtx(x, y, targetId) {
  const ctx = $('ctx');
  ctx.innerHTML = '';
  const items = [
    { label: '🔇 Выключить звук', fn: () => forceMute(targetId) },
    { label: '💬 Заблокировать чат', fn: () => blockChat(targetId) },
    { label: '🚪 Кикнуть', fn: () => kick(targetId), danger: true }
  ];
  items.forEach(it => {
    const b = document.createElement('button');
    b.textContent = it.label;
    if (it.danger) b.className = 'danger';
    b.onclick = () => { it.fn(); ctx.style.display = 'none'; };
    ctx.appendChild(b);
  });
  ctx.style.left = x + 'px';
  ctx.style.top = y + 'px';
  ctx.style.display = 'block';
}
document.addEventListener('click', () => $('ctx').style.display = 'none');

function forceMute(targetId) {
  const c = conns[targetId];
  if (c) c.send({ type: 'mute-force' });
  toast('Участнику выключен микрофон');
}
function blockChat(targetId) {
  const c = conns[targetId];
  if (!c) return;
  // toggle
  meta[targetId] = meta[targetId] || {};
  meta[targetId].blocked = !meta[targetId].blocked;
  c.send({ type: 'block-chat', on: meta[targetId].blocked });
  toast(meta[targetId].blocked ? 'Чат заблокирован' : 'Чат разблокирован');
}
function kick(targetId) {
  const c = conns[targetId];
  if (c) c.send({ type: 'kick' });
  toast('Участник кикнут');
}

/* ---------- УСТРОЙСТВА ---------- */
async function openDevices() {
  const devs = await navigator.mediaDevices.enumerateDevices();
  const fill = (sel, kind, label) => {
    sel.innerHTML = '';
    devs.filter(d => d.kind === kind).forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId;
      o.textContent = d.label || (label + ' ' + (i + 1));
      sel.appendChild(o);
    });
  };
  fill($('devCam'), 'videoinput', 'Камера');
  fill($('devMic'), 'audioinput', 'Микрофон');
  fill($('devSpk'), 'audiooutput', 'Динамики');
  $('devices').classList.add('open');
}
function closeDevices() { $('devices').classList.remove('open'); }

/* ---------- СТАРТ ---------- */
if (myName) {
  enterMenu();
}
</script>
