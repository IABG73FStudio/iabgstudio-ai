<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IABG Meet - Відеодзвінки</title>
    
    <!-- Бібліотека PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #0d0e12;
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ЕКРАН ВХОДУ (ЛОБІ) */
        #lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }

        .card {
            background: #181922;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid #28293d;
        }

        h1 { margin-top: 0; color: #00a2ff; font-size: 28px; }
        p { color: #aaa; font-size: 14px; }

        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #333;
            font-size: 15px;
        }

        input { background: #222332; color: #fff; text-align: center; }

        button {
            background: #00a2ff;
            color: #fff;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #0084cc; }
        .btn-join { background: #00b06f; }
        .btn-join:hover { background: #008f5a; }

        #errorMsg {
            color: #ff4747;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        /* КІМНАТА ДЗВІНКУ ТА РІВНОПРАВНА МОЗАЇКА */
        #callRoom {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #videoGrid {
            flex: 1;
            display: grid;
            gap: 12px;
            padding: 16px;
            background: #08090c;
            width: 100%;
            height: calc(100vh - 75px);
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            background: #181920;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-width: 0;  /* Запобігає поломці сітки */
            min-height: 0; /* Запобігає поломці сітки */
            border: 3px solid transparent;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* БІЛЕ СЯЙВО ПРИ РОЗМОВІ */
        .video-container.speaking {
            border-color: #ffffff !important;
            box-shadow: 0 0 25px 6px rgba(255, 255, 255, 0.9) !important;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        /* АВАТАРКА ЧОЛОВІЧКА С РАНДОМНИМ КОЛЬОРОМ */
        .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            user-select: none;
        }

        .user-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.75);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            z-index: 3;
            backdrop-filter: blur(4px);
        }

        /* ПАНЕЛЬ КЕРУВАННЯ */
        .controls {
            height: 75px;
            background: #181922;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 10px;
            border-top: 1px solid #28293d;
        }

        .ctrl-btn {
            width: auto;
            padding: 12px 20px;
            margin: 0;
            border-radius: 30px;
            font-size: 14px;
        }

        .btn-red { background: #ff4747; }
        .btn-red:hover { background: #cc3737; }
        .btn-gray { background: #33344a; }
        .btn-gray:hover { background: #444563; }
    </style>
</head>
<body>

    <!-- ЕКРАН ВХОДУ -->
    <div id="lobby">
        <div class="card">
            <h1>IABG Meet 🎥</h1>
            <p>Введіть код або створіть новий дзвінок</p>
            
            <button onclick="createRoom()">➕ Створити новий дзвінок</button>
            
            <div style="margin: 12px 0; color: #555;">— АБО —</div>
            
            <input type="text" id="roomInput" placeholder="Введіть код кімнати">
            <button class="btn-join" onclick="joinByInput()">Приєднатися</button>

            <div id="errorMsg"></div>
        </div>
    </div>

    <!-- КІМНАТА ДЗВІНКУ -->
    <div id="callRoom">
        <div id="videoGrid"></div>

        <div class="controls">
            <button class="ctrl-btn btn-gray" id="micBtn" onclick="toggleMic()">🎤 Мікрофон</button>
            <button class="ctrl-btn btn-gray" id="camBtn" onclick="toggleCam()">📹 Камера</button>
            <button class="ctrl-btn btn-gray" onclick="copyRoomLink()">🔗 Скопіювати посилання</button>
            <button class="ctrl-btn btn-red" onclick="leaveCall()">📞 Завершити</button>
        </div>
    </div>

    <script>
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            }
        };

        let localStream;
        let peer;
        let myPeerId = "";
        let isHost = false;
        let isMicOn = true;
        let isCamOn = true;
        let roomIdGlobal = "";

        let hostConn = null; // Для гостей: з'єднання з господарем
        const clientConns = {}; // Для господаря: з'єднання з усіма гостями
        const calls = {}; // Усі активні медіа-дзвінки
        const userCamStates = {}; // Стан камер всіх користувачів

        window.onload = () => {
            const hashRoom = window.location.hash.substring(1);
            if (hashRoom) {
                document.getElementById('roomInput').value = hashRoom;
                joinRoom(hashRoom);
            }
            window.addEventListener('resize', updateMosaicLayout);
        };

        window.onbeforeunload = () => leaveCall();

        function showError(msg) { document.getElementById('errorMsg').innerText = msg; }
        function clearError() { document.getElementById('errorMsg').innerText = ""; }

        function getRandomColor(id) {
            let hash = 0;
            for (let i = 0; i < id.length; i++) {
                hash = id.charCodeAt(i) + ((hash << 5) - hash);
            }
            const h = Math.abs(hash) % 360;
            return `hsl(${h}, 65%, 40%)`;
        }

        async function getMedia() {
            try {
                if (!localStream) {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                }
                return true;
            } catch (err) {
                showError("❌ Дозвольте доступ до камери та мікрофона!");
                return false;
            }
        }

        // РЕТРАНСЛЯЦІЯ ВІД ГОСПОДАРЯ ДО ВСІХ ГОСТЕЙ
        function broadcastFromHost(msg, exceptPeerId = null) {
            Object.keys(clientConns).forEach(pId => {
                if (pId !== exceptPeerId && clientConns[pId] && clientConns[pId].open) {
                    clientConns[pId].send(msg);
                }
            });
        }

        // 1. СТВОРЕННЯ КІМНАТИ (ГОСПОДАР)
        async function createRoom() {
            clearError();
            if (!await getMedia()) return;

            isHost = true;
            roomIdGlobal = 'meet-' + Math.random().toString(36).substring(2, 8);
            window.location.hash = roomIdGlobal;

            peer = new Peer(roomIdGlobal, peerConfig);

            peer.on('open', (id) => {
                myPeerId = id;
                userCamStates[myPeerId] = true;
                showCallScreen();
                addVideoStream(myPeerId, localStream, 'Ви (Господар)');
            });

            // Обробка вхідних з'єднань даних від гостей
            peer.on('connection', (conn) => {
                conn.on('open', () => {
                    clientConns[conn.peer] = conn;

                    // Передаємо новому гостю повний стан кімнати
                    const currentPeers = Object.keys(clientConns).concat([myPeerId]);
                    conn.send({
                        type: 'ROOM_STATE',
                        peers: currentPeers,
                        camStates: userCamStates
                    });

                    // Оповіщаємо інших про нового учасника
                    broadcastFromHost({ type: 'USER_JOINED', peerId: conn.peer }, conn.peer);
                });

                conn.on('data', (data) => handleIncomingData(data, conn.peer));

                conn.on('close', () => handleUserLeave(conn.peer));
            });

            // Приймаємо вхідні відео-дзвінки
            peer.on('call', (call) => {
                call.answer(localStream);
                handleCallStream(call);
            });

            peer.on('error', (err) => showError("❌ Помилка сервера: " + err.type));
        }

        // 2. ПРИЄДНАННЯ ДО КІМНАТИ (УЧАСНИКИ)
        function joinByInput() {
            clearError();
            const rId = document.getElementById('roomInput').value.trim();
            if (!rId) return showError("❌ Введіть код або посилання!");
            joinRoom(rId);
        }

        async function joinRoom(rId) {
            clearError();
            if (!await getMedia()) return;

            roomIdGlobal = rId;
            peer = new Peer(peerConfig);

            peer.on('open', (id) => {
                myPeerId = id;
                isHost = false;
                userCamStates[myPeerId] = true;

                showCallScreen();
                addVideoStream(myPeerId, localStream, 'Ви');

                // Підключаємо канал даних до Господаря
                hostConn = peer.connect(roomIdGlobal);

                hostConn.on('open', () => {
                    // Господар зареєструє нас і надішле ROOM_STATE
                });

                hostConn.on('data', (data) => handleIncomingData(data, roomIdGlobal));

                // Обробляємо вхідні відеодзвінки від інших учасників
                peer.on('call', (call) => {
                    call.answer(localStream);
                    handleCallStream(call);
                });
            });

            peer.on('error', () => showError("❌ Не вдалося підключитися до кімнати!"));
        }

        // ОБРОБКА ДАНИХ СИНХРОНІЗАЦІЇ
        function handleIncomingData(data, senderPeerId) {
            if (data.type === 'ROOM_STATE') {
                // Новий гравець отримує список усіх присутніх і телефонує кожному
                Object.assign(userCamStates, data.camStates);
                data.peers.forEach(pId => {
                    if (pId !== myPeerId) {
                        callPeer(pId);
                    }
                });
            } else if (data.type === 'USER_JOINED') {
                // Хтось новий увійшов. Очікуємо від нього дзвінка.
            } else if (data.type === 'CAM_STATE') {
                userCamStates[data.peerId] = data.enabled;
                setCamDisplay(data.peerId, data.enabled);

                if (isHost) {
                    broadcastFromHost(data, senderPeerId);
                }
            } else if (data.type === 'LEAVE') {
                removeVideoStream(data.peerId);
                delete userCamStates[data.peerId];

                if (isHost) {
                    delete clientConns[data.peerId];
                    broadcastFromHost(data, senderPeerId);
                }
            }
        }

        // ЗДІЙСНЕННЯ ДЗВІНКА ДО УЧАСНИКА
        function callPeer(targetPeerId) {
            if (!targetPeerId || targetPeerId === myPeerId || calls[targetPeerId]) return;

            const call = peer.call(targetPeerId, localStream);
            handleCallStream(call, targetPeerId);
        }

        // ОБРОБКА ВІДЕОПОТОКУ
        function handleCallStream(call, fallbackId) {
            const peerId = call.peer || fallbackId;
            if (!peerId) return;

            if (calls[peerId]) calls[peerId].close();
            calls[peerId] = call;

            call.on('stream', (remoteStream) => {
                let label = 'Учасник (' + peerId.substring(0, 4) + ')';
                if (peerId === roomIdGlobal) label = 'Господар';

                addVideoStream(peerId, remoteStream, label);
            });

            call.on('close', () => removeVideoStream(peerId));
        }

        // СТВОРЕННЯ/ОНОВЛЕННЯ ЕЛЕМЕНТА ВІДЕО В МОЗАЇЦІ
        function addVideoStream(peerId, stream, labelText) {
            let container = document.getElementById('container-' + peerId);

            if (!container) {
                const grid = document.getElementById('videoGrid');
                container = document.createElement('div');
                container.className = 'video-container';
                container.id = 'container-' + peerId;

                const avatar = document.createElement('div');
                avatar.className = 'avatar-placeholder';
                avatar.id = 'avatar-' + peerId;
                avatar.style.background = getRandomColor(peerId);
                avatar.innerHTML = `<div class="avatar-circle">👤</div>`;

                const video = document.createElement('video');
                video.id = 'video-' + peerId;
                video.srcObject = stream;
                video.autoplay = true;
                video.playsInline = true;
                if (peerId === myPeerId) video.muted = true;

                const label = document.createElement('div');
                label.className = 'user-label';
                label.innerText = labelText;

                container.appendChild(avatar);
                container.appendChild(video);
                container.appendChild(label);
                grid.appendChild(container);

                setupVoiceDetection(stream, container.id);
            } else {
                const video = document.getElementById('video-' + peerId);
                if (video) video.srcObject = stream;
            }

            const isCamEnabled = userCamStates[peerId] !== undefined ? userCamStates[peerId] : true;
            setCamDisplay(peerId, isCamEnabled);
            updateMosaicLayout();
        }

        // ДИНАМІЧНИЙ РЕЖИМ МОЗАЇКИ ДЛЯ ВСІХ
        function updateMosaicLayout() {
            const grid = document.getElementById('videoGrid');
            const count = grid.children.length;

            if (count <= 1) {
                grid.style.gridTemplateColumns = '1fr';
                grid.style.gridTemplateRows = '1fr';
            } else if (count === 2) {
                if (window.innerWidth > window.innerHeight) {
                    grid.style.gridTemplateColumns = '1fr 1fr';
                    grid.style.gridTemplateRows = '1fr';
                } else {
                    grid.style.gridTemplateColumns = '1fr';
                    grid.style.gridTemplateRows = '1fr 1fr';
                }
            } else if (count <= 4) {
                grid.style.gridTemplateColumns = '1fr 1fr';
                grid.style.gridTemplateRows = '1fr 1fr';
            } else if (count <= 6) {
                grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
                grid.style.gridTemplateRows = 'repeat(2, 1fr)';
            } else if (count <= 9) {
                grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
                grid.style.gridTemplateRows = 'repeat(3, 1fr)';
            } else {
                grid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(200px, 1fr))';
                grid.style.gridTemplateRows = 'repeat(auto-fit, minmax(150px, 1fr))';
            }
        }

        function setCamDisplay(peerId, isEnabled) {
            const videoEl = document.getElementById('video-' + peerId);
            if (videoEl) {
                videoEl.style.display = isEnabled ? 'block' : 'none';
            }
        }

        // ДЕТЕКТОР ГОЛОСУ (БІЛЕ СЯЙВО НА ВІКНІ)
        function setupVoiceDetection(stream, containerId) {
            try {
                if (stream.getAudioTracks().length === 0) return;

                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function checkVolume() {
                    const container = document.getElementById(containerId);
                    if (!container) return;

                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    let average = sum / dataArray.length;

                    if (average > 15) {
                        container.classList.add('speaking');
                    } else {
                        container.classList.remove('speaking');
                    }

                    requestAnimationFrame(checkVolume);
                }
                checkVolume();
            } catch (e) { console.log("Voice error:", e); }
        }

        function handleUserLeave(peerId) {
            removeVideoStream(peerId);
            delete userCamStates[peerId];
            delete clientConns[peerId];
            broadcastFromHost({ type: 'LEAVE', peerId: peerId });
        }

        function removeVideoStream(peerId) {
            const container = document.getElementById('container-' + peerId);
            if (container) container.remove();
            if (calls[peerId]) {
                calls[peerId].close();
                delete calls[peerId];
            }
            updateMosaicLayout();
        }

        function showCallScreen() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('callRoom').style.display = 'flex';
        }

        function copyRoomLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("🔗 Посилання скопійовано! Надішли його друзям.");
        }

        function toggleMic() {
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            const btn = document.getElementById('micBtn');
            btn.innerText = isMicOn ? "🎤 Мікрофон" : "🔇 Мікрофон (Вимк)";
            btn.style.background = isMicOn ? "#33344a" : "#ff4747";
        }

        function toggleCam() {
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;

            userCamStates[myPeerId] = isCamOn;
            setCamDisplay(myPeerId, isCamOn);

            const msg = { type: 'CAM_STATE', peerId: myPeerId, enabled: isCamOn };
            if (isHost) {
                broadcastFromHost(msg);
            } else if (hostConn && hostConn.open) {
                hostConn.send(msg);
            }

            const btn = document.getElementById('camBtn');
            btn.innerText = isCamOn ? "📹 Камера" : "📷 Камера (Вимк)";
            btn.style.background = isCamOn ? "#33344a" : "#ff4747";
        }

        function leaveCall() {
            const msg = { type: 'LEAVE', peerId: myPeerId };
            if (isHost) {
                broadcastFromHost(msg);
            } else if (hostConn && hostConn.open) {
                hostConn.send(msg);
            }

            if (localStream) localStream.getTracks().forEach(track => track.stop());
            if (peer) peer.destroy();
            window.location.hash = "";
            location.reload();
        }
    </script>
</body>
</html>
