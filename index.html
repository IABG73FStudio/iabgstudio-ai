<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Hub - Приватний Чат</title>

    <!-- Підключаємо Firebase (База даних + Чат + Онлайн прямо в браузері) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Підключаємо EmailJS (Надсилання кодів на пошту без сервера) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0e0f12; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .box { background: #181920; padding: 25px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h2, h3 { color: #00a2ff; margin-top: 0; text-align: center; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; box-sizing: border-box; font-size: 14px; }
        input { background: #0a0b0d; color: #fff; }
        button { background: #00a2ff; color: #fff; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0084cc; }
        .toggle-btn { background: transparent; color: #888; text-decoration: underline; font-size: 13px; margin-top: 10px; }
        
        #chatArea { display: none; max-width: 600px; }
        #messages { height: 300px; background: #0a0b0d; border: 1px solid #222; border-radius: 8px; padding: 12px; overflow-y: auto; margin: 10px 0; }
        #messages p { margin: 6px 0; font-size: 14px; }
        .status { font-size: 13px; text-align: center; color: #ff4747; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- СЕКЦІЯ ВХОДУ ТА РЕЄСТРАЦІЇ -->
    <div class="box" id="authArea">
        <h2>Roblox Hub</h2>

        <!-- ФОРМА ВХОДУ -->
        <div id="loginForm">
            <h3>Вхід</h3>
            <input type="text" id="loginUser" placeholder="Справжній нікнейм Roblox">
            <input type="password" id="loginPass" placeholder="Пароль від сайту">
            <button onclick="login()">Увійти</button>
            <button class="toggle-btn" onclick="toggleAuth()">Немає акаунту? Зареєструватись</button>
        </div>

        <!-- ФОРМА РЕЄСТРАЦІЇ -->
        <div id="registerForm" style="display: none;">
            <h3>Реєстрація</h3>
            <input type="text" id="regUser" placeholder="Справжній нікнейм Roblox">
            <input type="email" id="regEmail" placeholder="Ваша пошта (Email)">
            <input type="password" id="regPass" placeholder="Вигадайте пароль для сайту">
            <button onclick="sendEmailCode()">Отримати код на пошту</button>

            <div id="codeSection" style="display: none; border-top: 1px dashed #444; margin-top: 10px; padding-top: 10px;">
                <input type="text" id="regCode" placeholder="Введіть 6-значний код">
                <button style="background: #00b06f" onclick="register()">Підтвердити і Створити</button>
            </div>
            <button class="toggle-btn" onclick="toggleAuth()">Вже є акаунт? Увійти</button>
        </div>

        <p class="status" id="statusMsg"></p>
    </div>

    <!-- СЕКЦІЯ ПРИВАТНОГО ЧАТУ -->
    <div class="box" id="chatArea">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="welcomeUser" style="margin:0;">Чат</h3>
            <button style="width: auto; padding: 6px 12px; background: #ff4747;" onclick="location.reload()">Вийти</button>
        </div>

        <div style="font-size: 12px; color: #00b06f; margin: 10px 0;">🟢 Онлайн в чаті: <span id="onlineCounter">1</span></div>

        <!-- Пошук друга -->
        <div style="display: flex; gap: 8px;">
            <input type="text" id="friendUser" placeholder="Нік друга в Roblox" style="margin:0;">
            <button style="width: 130px; margin:0;" onclick="openPrivateChat()">Відкрити чат</button>
        </div>

        <p id="chatHeader" style="font-size: 12px; color: #777; margin: 10px 0;">Введіть нік друга для переписки</p>

        <!-- Вікно повідомлень -->
        <div id="messages"></div>

        <!-- Ввід тексту -->
        <div style="display: flex; gap: 8px;">
            <input type="text" id="msgInput" placeholder="Напиши повідомлення..." style="margin:0;" onkeypress="if(event.key==='Enter') sendMsg()">
            <button style="width: 100px; margin:0;" onclick="sendMsg()">Надіслати</button>
        </div>
    </div>

    <script>
        // --- 1. НАЛАШТУВАННЯ FIREBASE (Безкоштовна База Даних) ---
        // Замініть ці дані на ваші з консолі Firebase (firebase.google.com)
        const firebaseConfig = {
            apiKey: "ТВІЙ_API_KEY",
            authDomain: "твій-проект.firebaseapp.com",
            databaseURL: "https://твій-проект-default-rtdb.firebaseio.com",
            projectId: "твій-проект",
            storageBucket: "твій-проект.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcde"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // EmailJS Init (для відправки кодів на пошту)
        emailjs.init("ТВІЙ_EMAILJS_PUBLIC_KEY");

        let currentUser = "";
        let currentFriend = "";
        let generatedCode = "";

        function toggleAuth() {
            const l = document.getElementById('loginForm');
            const r = document.getElementById('registerForm');
            l.style.display = l.style.display === 'none' ? 'block' : 'none';
            r.style.display = r.style.display === 'none' ? 'block' : 'none';
            document.getElementById('statusMsg').innerText = "";
        }

        // --- 2. ПЕРЕВІРКА СПРАВЖНЬОГО РОБЛОКС НІКУ ТА ВІДПРАВКА КОДУ ---
        async function sendEmailCode() {
            const username = document.getElementById('regUser').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value.trim();

            if (!username || !email || !pass) return setStatus("Заповніть усі поля!");

            setStatus("Перевіряємо акаунт Roblox...");

            try {
                // Перевірка через API Roblox (через CORS проксі)
                const res = await fetch(`https://corsproxy.io/?https://users.roblox.com/v1/usernames/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usernames: [username], excludeBannedUsers: true })
                });
                const data = await res.json();

                if (!data.data || data.data.length === 0) {
                    return setStatus("ПОМИЛКА: Такого справжнього акаунту Roblox не існує!");
                }

                // Генеруємо 6-значний код
                generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

                // Надсилаємо пошту через EmailJS
                /* emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', {
                    to_email: email,
                    code: generatedCode
                }); */

                console.log("ТЕСТОВИЙ КОД З ПОШТИ:", generatedCode);
                document.getElementById('codeSection').style.display = 'block';
                setStatus("Код відправлено на пошту! (Для тесту дивись F12 консоль)");

            } catch (e) {
                setStatus("Помилка з'єднання з API Roblox.");
            }
        }

        // --- 3. РЕЄСТРАЦІЯ У БАЗІ ---
        function register() {
            const username = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const inputCode = document.getElementById('regCode').value.trim();

            if (inputCode !== generatedCode) {
                return setStatus("Невірний код з пошти!");
            }

            // Зберігаємо в базу Firebase
            db.ref('users/' + username).set({
                password: pass,
                registeredAt: Date.now()
            }, (err) => {
                if (err) setStatus("Помилка збереження.");
                else {
                    setStatus("Успішно зареєстровано! Тепер увійдіть.");
                    setTimeout(toggleAuth, 1000);
                }
            });
        }

        // --- 4. ВХІД (АВТОРИЗАЦІЯ) ---
        function login() {
            const username = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if (!username || !pass) return setStatus("Введіть нік та пароль!");

            db.ref('users/' + username).once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    return setStatus("Акаунт не знайдено! Спочатку зареєструйтесь.");
                }

                const userData = snapshot.val();
                if (userData.password !== pass) {
                    return setStatus("Невірний пароль від сайту!");
                }

                // Успішний вхід
                currentUser = username;
                document.getElementById('authArea').style.display = 'none';
                document.getElementById('chatArea').style.display = 'block';
                document.getElementById('welcomeUser').innerText = currentUser;

                // Відмічаємо онлайн у базі
                const presenceRef = db.ref('online/' + currentUser);
                presenceRef.set(true);
                presenceRef.onDisconnect().remove();

                // Слухаємо кількість онлайн
                db.ref('online').on('value', (snap) => {
                    document.getElementById('onlineCounter').innerText = snap.numChildren();
                });
            });
        }

        // --- 5. ПРИВАТНИЙ ЧАТ (ІСТОРІЯ НЕ ЗНИКАЄ) ---
        function openPrivateChat() {
            const friend = document.getElementById('friendUser').value.trim();
            if (!friend) return alert("Введіть нік друга!");
            if (friend === currentUser) return alert("Не можна писати самому собі!");

            currentFriend = friend;
            document.getElementById('chatHeader').innerText = `Приватний чат з: ${currentFriend}`;
            document.getElementById('messages').innerHTML = "";

            // Ключ чату (однаковий для обох друзів)
            const chatKey = [currentUser, currentFriend].sort().join('_');

            // Завантажуємо історію і слухаємо нові повідомлення в реальному часі
            db.ref('chats/' + chatKey).off(); // вимикаємо старі слухачі
            db.ref('chats/' + chatKey).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                appendMessage(msg.sender, msg.text);
            });
        }

        function sendMsg() {
            const text = document.getElementById('msgInput').value.trim();
            if (!currentFriend || !text) return;

            const chatKey = [currentUser, currentFriend].sort().join('_');
            
            // Записуємо в базу (зберігається назавжди)
            db.ref('chats/' + chatKey).push({
                sender: currentUser,
                text: text,
                time: Date.now()
            });

            document.getElementById('msgInput').value = "";
        }

        function appendMessage(sender, text) {
            const box = document.getElementById('messages');
            const color = sender === currentUser ? '#00a2ff' : '#00b06f';
            box.innerHTML += `<p><b style="color:${color}">${sender}:</b> ${text}</p>`;
            box.scrollTop = box.scrollHeight;
        }

        function setStatus(msg) {
            document.getElementById('statusMsg').innerText = msg;
        }
    </script>
</body>
</html>
