<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IABG Meet - Відеодзвінки</title>
    
    <!-- Бібліотека PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #0d0e12;
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ЕКРАН ВХОДУ (ЛОБІ) */
        #lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }

        .card {
            background: #181922;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid #28293d;
        }

        h1 { margin-top: 0; color: #00a2ff; font-size: 28px; }
        p { color: #aaa; font-size: 14px; }

        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #333;
            font-size: 15px;
        }

        input { background: #222332; color: #fff; text-align: center; }

        button {
            background: #00a2ff;
            color: #fff;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #0084cc; }
        .btn-join { background: #00b06f; }
        .btn-join:hover { background: #008f5a; }

        #errorMsg {
            color: #ff4747;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        /* ВІДЕО-СІТКА */
        #callRoom {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #videoGrid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
            padding: 20px;
            background: #08090c;
            overflow-y: auto;
            align-content: center;
        }

        .video-container {
            position: relative;
            background: #181920;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
            min-height: 200px;
            border: 3px solid transparent;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        /* БІЛЕ СЯЙВО ПРИ РОЗМОВІ */
        .video-container.speaking {
            border-color: #ffffff !important;
            box-shadow: 0 0 25px 5px rgba(255, 255, 255, 0.85) !important;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        /* АВАТАРКА ЧОЛОВІЧКА С РАНДОМНИМ КОЛЬОРОМ */
        .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .avatar-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            user-select: none;
        }

        .user-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.75);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            z-index: 3;
            backdrop-filter: blur(4px);
        }

        /* ПАНЕЛЬ КЕРУВАННЯ */
        .controls {
            height: 80px;
            background: #181922;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 0 10px;
            border-top: 1px solid #28293d;
        }

        .ctrl-btn {
            width: auto;
            padding: 12px 22px;
            margin: 0;
            border-radius: 30px;
            font-size: 15px;
        }

        .btn-red { background: #ff4747; }
        .btn-red:hover { background: #cc3737; }
        .btn-gray { background: #33344a; }
        .btn-gray:hover { background: #444563; }
    </style>
</head>
<body>

    <!-- ЕКРАН ВХОДУ -->
    <div id="lobby">
        <div class="card">
            <h1>IABG Meet 🎥</h1>
            <p>Введіть код або створіть новий дзвінок</p>
            
            <button onclick="createRoom()">➕ Створити новий дзвінок</button>
            
            <div style="margin: 12px 0; color: #555;">— АБО —</div>
            
            <input type="text" id="roomInput" placeholder="Введіть код кімнати">
            <button class="btn-join" onclick="joinByInput()">Приєднатися</button>

            <div id="errorMsg"></div>
        </div>
    </div>

    <!-- КІМНАТА ДЗВІНКУ -->
    <div id="callRoom">
        <div id="videoGrid"></div>

        <div class="controls">
            <button class="ctrl-btn btn-gray" id="micBtn" onclick="toggleMic()">🎤 Мікрофон</button>
            <button class="ctrl-btn btn-gray" id="camBtn" onclick="toggleCam()">📹 Камера</button>
            <button class="ctrl-btn btn-gray" onclick="copyRoomLink()">🔗 Скопіювати посилання</button>
            <button class="ctrl-btn btn-red" onclick="leaveCall()">📞 Завершити</button>
        </div>
    </div>

    <script>
        // НАЛАШТУВАННЯ СЕРВЕРІВ GOOGLE ДЛЯ ПРОБИТТЯ РОУТЕРІВ
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ]
            }
        };

        let localStream;
        let peer;
        let isMicOn = true;
        let isCamOn = true;
        let roomIdGlobal = "";
        const calls = {};
        const dataConns = {};
        const roomPeers = new Set();

        window.onload = () => {
            const hashRoom = window.location.hash.substring(1);
            if (hashRoom) {
                document.getElementById('roomInput').value = hashRoom;
                joinRoom(hashRoom);
            }
        };

        function showError(msg) {
            document.getElementById('errorMsg').innerText = msg;
        }

        function clearError() {
            document.getElementById('errorMsg').innerText = "";
        }

        function getRandomColor(id) {
            let hash = 0;
            for (let i = 0; i < id.length; i++) {
                hash = id.charCodeAt(i) + ((hash << 5) - hash);
            }
            const h = Math.abs(hash) % 360;
            return `hsl(${h}, 65%, 40%)`;
        }

        async function getMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                return true;
            } catch (err) {
                showError("❌ Надайте доступ до камери та мікрофона у браузері!");
                return false;
            }
        }

        // 1. СТВОРЕННЯ КІМНАТИ (ГОСПОДАР)
        async function createRoom() {
            clearError();
            if (!await getMedia()) return;

            roomIdGlobal = 'meet-' + Math.random().toString(36).substring(2, 8);
            window.location.hash = roomIdGlobal;

            peer = new Peer(roomIdGlobal, peerConfig);

            peer.on('open', (id) => {
                showCallScreen();
                roomPeers.add(id);
                addVideoStream('local', localStream, 'Ви (Господар)');
            });

            // Господар приймає дата-з'єднання та розсилає список усім
            peer.on('connection', (conn) => {
                conn.on('open', () => {
                    dataConns[conn.peer] = conn;
                    roomPeers.add(conn.peer);
                    broadcastPeerList(); // Розсилаємо оновлений список усім!
                });

                conn.on('close', () => {
                    delete dataConns[conn.peer];
                    roomPeers.delete(conn.peer);
                    removeVideoStream(conn.peer);
                    broadcastPeerList();
                });
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                handleIncomingCall(call);
            });

            peer.on('error', (err) => showError("❌ Помилка сервера: " + err.type));
        }

        // Розсилка всім учасникам актуального списку людей у кімнаті
        function broadcastPeerList() {
            const list = Array.from(roomPeers);
            Object.values(dataConns).forEach(conn => {
                if (conn.open) {
                    conn.send({ type: 'PEER_LIST', peers: list });
                }
            });
        }

        // 2. ПРИЄДНАННЯ ДО КІМНАТИ (УЧАСНИКИ)
        function joinByInput() {
            clearError();
            const rId = document.getElementById('roomInput').value.trim();
            if (!rId) return showError("❌ Введіть код або посилання!");
            joinRoom(rId);
        }

        async function joinRoom(rId) {
            clearError();
            if (!await getMedia()) return;

            roomIdGlobal = rId;
            peer = new Peer(peerConfig);

            peer.on('open', (myId) => {
                let connected = false;

                const conn = peer.connect(roomIdGlobal);
                
                conn.on('open', () => {
                    connected = true;
                    showCallScreen();
                    addVideoStream('local', localStream, 'Ви');
                });

                // Коли від господаря приходить новий список людей
                conn.on('data', (data) => {
                    if (data.type === 'PEER_LIST') {
                        data.peers.forEach(targetPeerId => {
                            if (targetPeerId !== myId && !calls[targetPeerId]) {
                                const call = peer.call(targetPeerId, localStream);
                                handleIncomingCall(call, targetPeerId);
                            }
                        });
                    }
                });

                peer.on('call', (call) => {
                    call.answer(localStream);
                    handleIncomingCall(call);
                });

                setTimeout(() => {
                    if (!connected) {
                        showError("❌ Помилка: Кімнату не знайдено або код невірний!");
                        if (localStream) localStream.getTracks().forEach(t => t.stop());
                        peer.destroy();
                    }
                }, 4000);
            });

            peer.on('error', (err) => showError("❌ Не вдалося підключитися до кімнати!"));
        }

        function handleIncomingCall(call, fallbackId) {
            const peerId = call.peer || fallbackId;
            if (!peerId) return;
            calls[peerId] = call;

            call.on('stream', (remoteStream) => {
                addVideoStream(peerId, remoteStream, `Учасник (${peerId.substring(0, 4)})`);
            });

            call.on('close', () => removeVideoStream(peerId));
        }

        // ДОДАВАННЯ ВІДЕО
        function addVideoStream(peerId, stream, labelText) {
            if (document.getElementById('container-' + peerId)) return;

            const grid = document.getElementById('videoGrid');
            const container = document.createElement('div');
            container.className = 'video-container';
            container.id = 'container-' + peerId;

            const avatar = document.createElement('div');
            avatar.className = 'avatar-placeholder';
            avatar.id = 'avatar-' + peerId;
            avatar.style.background = getRandomColor(peerId);
            avatar.innerHTML = `<div class="avatar-circle">👤</div>`;

            const video = document.createElement('video');
            video.id = 'video-' + peerId;
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (peerId === 'local') video.muted = true;

            const label = document.createElement('div');
            label.className = 'user-label';
            label.innerText = labelText;

            container.appendChild(avatar);
            container.appendChild(video);
            container.appendChild(label);
            grid.appendChild(container);

            checkCameraState(stream, peerId);
            setupVoiceDetection(stream, container.id);
        }

        function checkCameraState(stream, peerId) {
            const videoTrack = stream.getVideoTracks()[0];
            const videoEl = document.getElementById('video-' + peerId);

            if (!videoTrack) return;

            const updateVisibility = () => {
                if (videoTrack.enabled) {
                    videoEl.style.display = 'block';
                } else {
                    videoEl.style.display = 'none';
                }
            };

            updateVisibility();
            setInterval(updateVisibility, 400);
        }

        // ДЕТЕКТОР ГОЛОСУ (БІЛЕ СЯЙВО)
        function setupVoiceDetection(stream, containerId) {
            try {
                if (stream.getAudioTracks().length === 0) return;

                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function checkVolume() {
                    const container = document.getElementById(containerId);
                    if (!container) return;

                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    let average = sum / dataArray.length;

                    if (average > 15) {
                        container.classList.add('speaking');
                    } else {
                        container.classList.remove('speaking');
                    }

                    requestAnimationFrame(checkVolume);
                }
                checkVolume();
            } catch (e) {
                console.log("Voice error:", e);
            }
        }

        function removeVideoStream(peerId) {
            const container = document.getElementById('container-' + peerId);
            if (container) container.remove();
            delete calls[peerId];
        }

        function showCallScreen() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('callRoom').style.display = 'flex';
        }

        function copyRoomLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("🔗 Посилання скопійовано! Надішли його друзям.");
        }

        function toggleMic() {
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            const btn = document.getElementById('micBtn');
            btn.innerText = isMicOn ? "🎤 Мікрофон" : "🔇 Мікрофон (Вимк)";
            btn.style.background = isMicOn ? "#33344a" : "#ff4747";
        }

        function toggleCam() {
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;

            const localVideo = document.getElementById('video-local');
            if (localVideo) {
                localVideo.style.display = isCamOn ? 'block' : 'none';
            }

            const btn = document.getElementById('camBtn');
            btn.innerText = isCamOn ? "📹 Камера" : "📷 Камера (Вимк)";
            btn.style.background = isCamOn ? "#33344a" : "#ff4747";
        }

        function leaveCall() {
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            if (peer) peer.destroy();
            window.location.hash = "";
            location.reload();
        }
    </script>
</body>
</html>
