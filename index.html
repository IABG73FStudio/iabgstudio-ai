<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Hub — IABG73Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #111216; color: #ffffff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; }
        
        /* Шапка */
        header { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; background: #1c1e24; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid #282b35; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 22px; font-weight: 800; color: #00a2ff; display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; }
        .logo-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; }
        
        .header-info { display: flex; align-items: center; gap: 15px; }
        .online-badge { background: rgba(0, 176, 111, 0.15); border: 1px solid #00b06f; color: #00b06f; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .online-dot { width: 8px; height: 8px; background: #00b06f; border-radius: 50%; box-shadow: 0 0 8px #00b06f; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .user-badge { display: flex; align-items: center; gap: 10px; background: #2a2d37; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 14px; }
        .user-avatar-small { width: 30px; height: 30px; border-radius: 50%; }
        .logout-btn { background: none; border: none; color: #ff5555; cursor: pointer; font-size: 12px; margin-left: 6px; text-decoration: underline; }
        
        .card { background: #1c1e24; border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid #282b35; }
        h2 { margin-bottom: 14px; font-size: 18px; color: #e1e1e1; border-bottom: 2px solid #282b35; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        
        .form-row { display: flex; gap: 10px; margin-top: 10px; }
        input { flex: 1; padding: 12px 15px; background: #111216; border: 1px solid #333745; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #00a2ff; }
        
        .btn { background: #00a2ff; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; white-space: nowrap; }
        .btn:hover { background: #0082cc; }
        .btn-green { background: #00b06f; }
        .btn-green:hover { background: #008f5a; }
        .btn-danger { background: #ff4747; padding: 6px 10px; font-size: 12px; border-radius: 6px; }

        .error-msg { color: #ff4747; background: rgba(255, 71, 71, 0.1); border: 1px solid #ff4747; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; display: none; }

        .friends-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 12px; }
        .friend-card { background: #111216; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; border: 1px solid #282b35; }
        .avatar { width: 70px; height: 70px; border-radius: 50%; margin-bottom: 10px; border: 2px solid #00a2ff; }
        .site-name { font-weight: 700; font-size: 16px; color: #ffffff; margin-bottom: 4px; }
        .friend-status { font-size: 12px; color: #00b06f; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }

        .invites-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .invite-item { display: flex; justify-content: space-between; align-items: center; background: #111216; padding: 12px; border-radius: 8px; border: 1px solid #282b35; }
        .invite-user { display: flex; align-items: center; gap: 10px; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal { background: #1c1e24; padding: 25px; border-radius: 16px; width: 90%; max-width: 380px; text-align: center; border: 1px solid #282b35; }
    </style>
</head>
<body>

    <!-- Вхід / Реєстрація -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal">
            <div style="width:50px; height:50px; margin: 0 auto 10px auto;">
                <svg viewBox="0 0 100 100" fill="none">
                    <g transform="rotate(-12 50 50)">
                        <rect x="15" y="15" width="70" height="70" rx="20" fill="#FF9E80" />
                        <rect x="10" y="10" width="80" height="80" rx="22" stroke="#1C1E24" stroke-width="12" fill="none" stroke-dasharray="240 30" />
                        <rect x="40" y="40" width="20" height="20" rx="5" fill="#1C1E24" />
                    </g>
                </svg>
            </div>
            <h2>🔐 Твій Нікнейм</h2>
            <p style="color: #aaa; margin-bottom: 15px; font-size: 13px;">Введи свій нік для входу в Roblox Hub:</p>
            <input type="text" id="siteNameInput" placeholder="Твій нікнейм (наприклад: Влад)">
            <button class="btn btn-green" style="width: 100%; margin-top: 12px;" onclick="registerAccount()">Увійти</button>
        </div>
    </div>

    <div class="container">
        <!-- Шапка -->
        <header>
            <a href="https://www.roblox.com" target="_blank" class="logo" title="Перейти в Roblox">
                <div class="logo-icon">
                    <svg viewBox="0 0 100 100" fill="none">
                        <g transform="rotate(-12 50 50)">
                            <rect x="15" y="15" width="70" height="70" rx="20" fill="#FF9E80" />
                            <rect x="10" y="10" width="80" height="80" rx="22" stroke="#00a2ff" stroke-width="12" fill="none" stroke-dasharray="240 30" />
                            <rect x="40" y="40" width="20" height="20" rx="5" fill="#00a2ff" />
                        </g>
                    </svg>
                </div>
                Roblox Hub
            </a>

            <div class="header-info">
                <div class="online-badge">
                    <span class="online-dot"></span>
                    Онлайн: <span id="onlineCounter">14</span>
                </div>

                <div class="user-badge" id="userBadge">
                    <img id="myAvatar" class="user-avatar-small" src="" alt="">
                    <span id="currentUserName">Гість</span>
                    <button class="logout-btn" onclick="logout()">Вийти</button>
                </div>
            </div>
        </header>

        <!-- Відправка Інвайту -->
        <div class="card">
            <h2>📩 Надіслати запрошення в друзі (Invite)</h2>
            <div class="form-row">
                <input type="text" id="friendNameInput" placeholder="Введи нікнейм друга...">
                <button class="btn btn-green" onclick="sendInvite()">Надіслати Invite</button>
            </div>
            <div id="errorBox" class="error-msg"></div>
        </div>

        <!-- Надіслані запрошення -->
        <div class="card">
            <h2>⏳ Надіслані запрошення</h2>
            <div id="invitesList" class="invites-list"></div>
        </div>

        <!-- Список Друзів -->
        <div class="card">
            <h2>👥 Мої Друзі</h2>
            <div id="friendsGrid" class="friends-grid"></div>
        </div>
    </div>

    <script>
        // 5 вбудованих легких аватарок (SVG Data URIs)
        const defaultAvatars = [
            `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23FF4747"/><circle cx="50" cy="40" r="22" fill="%23FFF"/><rect x="25" y="68" width="50" height="32" rx="10" fill="%23FFF"/></svg>`,
            `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%2300A2FF"/><circle cx="50" cy="40" r="22" fill="%23FFF"/><rect x="25" y="68" width="50" height="32" rx="10" fill="%23FFF"/></svg>`,
            `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%2300B06F"/><circle cx="50" cy="40" r="22" fill="%23FFF"/><rect x="25" y="68" width="50" height="32" rx="10" fill="%23FFF"/></svg>`,
            `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%239B51E0"/><circle cx="50" cy="40" r="22" fill="%23FFF"/><rect x="25" y="68" width="50" height="32" rx="10" fill="%23FFF"/></svg>`,
            `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23F2994A"/><circle cx="50" cy="40" r="22" fill="%23FFF"/><rect x="25" y="68" width="50" height="32" rx="10" fill="%23FFF"/></svg>`
        ];

        let myAccount = JSON.parse(localStorage.getItem('hub_acc_v2')) || null;
        let friends = JSON.parse(localStorage.getItem('hub_friends_v2')) || [];
        let invites = JSON.parse(localStorage.getItem('hub_invites_v2')) || [];

        function getRandomAvatar() {
            return defaultAvatars[Math.floor(Math.random() * defaultAvatars.length)];
        }

        window.onload = function() {
            if (myAccount) {
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('currentUserName').innerText = myAccount.siteName;
                document.getElementById('myAvatar').src = myAccount.avatar;
            }
            renderFriends();
            renderInvites();
            startOnlineCounter();
        };

        function registerAccount() {
            const name = document.getElementById('siteNameInput').value.trim();
            if (!name || name.length < 2) {
                alert("Введіть коректний нікнейм (мінімум 2 символи)!");
                return;
            }
            myAccount = { siteName: name, avatar: getRandomAvatar() };
            localStorage.setItem('hub_acc_v2', JSON.stringify(myAccount));
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('currentUserName').innerText = myAccount.siteName;
            document.getElementById('myAvatar').src = myAccount.avatar;
        }

        function logout() {
            localStorage.removeItem('hub_acc_v2');
            location.reload();
        }

        // Надсилання інвайту з перевіркою на помилку
        function sendInvite() {
            const input = document.getElementById('friendNameInput');
            const errorBox = document.getElementById('errorBox');
            const targetName = input.value.trim();

            errorBox.style.display = 'none';

            // Перевірка 1: Порожнє поле або занадто короткий нік
            if (!targetName || targetName.length < 3) {
                errorBox.innerText = "❌ Помилка: Користувача з таким ніком не знайдено! (Мінімум 3 символи)";
                errorBox.style.display = 'block';
                return;
            }

            // Перевірка 2: Спроба додати самого себе
            if (myAccount && targetName.toLowerCase() === myAccount.siteName.toLowerCase()) {
                errorBox.innerText = "❌ Помилка: Ви не можете надіслати запрошення самому собі!";
                errorBox.style.display = 'block';
                return;
            }

            // Перевірка 3: Вже в друзях
            if (friends.some(f => f.name.toLowerCase() === targetName.toLowerCase())) {
                errorBox.innerText = "❌ Помилка: Цей користувач вже у вашому списку друзів!";
                errorBox.style.display = 'block';
                return;
            }

            // Перевірка 4: Інвайт вже відправлено
            if (invites.some(i => i.name.toLowerCase() === targetName.toLowerCase())) {
                errorBox.innerText = "❌ Помилка: Запрошення цьому користувачу вже відправлено!";
                errorBox.style.display = 'block';
                return;
            }

            // Успішне створення інвайту
            const newInvite = {
                id: Date.now(),
                name: targetName,
                avatar: getRandomAvatar(),
                status: "Очікує підтвердження..."
            };

            invites.push(newInvite);
            localStorage.setItem('hub_invites_v2', JSON.stringify(invites));
            input.value = '';
            renderInvites();
        }

        function cancelInvite(id) {
            invites = invites.filter(i => i.id !== id);
            localStorage.setItem('hub_invites_v2', JSON.stringify(invites));
            renderInvites();
        }

        // Симуляція того, що друг прийняв інвайт (для тесту)
        function acceptInviteForTest(id) {
            const inv = invites.find(i => i.id === id);
            if (inv) {
                friends.push({ id: Date.now(), name: inv.name, avatar: inv.avatar });
                localStorage.setItem('hub_friends_v2', JSON.stringify(friends));
                cancelInvite(id);
                renderFriends();
            }
        }

        function deleteFriend(id) {
            friends = friends.filter(f => f.id !== id);
            localStorage.setItem('hub_friends_v2', JSON.stringify(friends));
            renderFriends();
        }

        function renderInvites() {
            const list = document.getElementById('invitesList');
            list.innerHTML = '';

            if (invites.length === 0) {
                list.innerHTML = '<p style="color: #777; font-size: 13px; text-align: center;">Немає активних запрошень.</p>';
                return;
            }

            invites.forEach(inv => {
                const item = document.createElement('div');
                item.className = 'invite-item';
                item.innerHTML = `
                    <div class="invite-user">
                        <img src="${inv.avatar}" class="user-avatar-small">
                        <div>
                            <strong>${inv.name}</strong>
                            <div style="font-size: 12px; color: #f2994a;">${inv.status}</div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 6px;">
                        <button class="btn btn-green" style="padding: 4px 8px; font-size: 11px;" onclick="acceptInviteForTest(${inv.id})">Прийняти (тест)</button>
                        <button class="btn btn-danger" onclick="cancelInvite(${inv.id})">Скасувати</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function renderFriends() {
            const grid = document.getElementById('friendsGrid');
            grid.innerHTML = '';

            if (friends.length === 0) {
                grid.innerHTML = '<p style="color: #777; grid-column: 1/-1; text-align: center; padding: 15px;">У вас поки немає доданих друзів.</p>';
                return;
            }

            friends.forEach(friend => {
                const card = document.createElement('div');
                card.className = 'friend-card';
                card.innerHTML = `
                    <button class="btn btn-danger" style="position: absolute; top: 8px; right: 8px;" onclick="deleteFriend(${friend.id})">✕</button>
                    <img src="${friend.avatar}" class="avatar">
                    <div class="site-name">${friend.name}</div>
                    <div class="friend-status">🟢 В мережі</div>
                `;
                grid.appendChild(card);
            });
        }

        // Лічильник людей на сайті
        function startOnlineCounter() {
            const counterEl = document.getElementById('onlineCounter');
            let baseOnline = 12 + Math.floor(Math.random() * 8);
            counterEl.innerText = baseOnline;

            setInterval(() => {
                const change = Math.floor(Math.random() * 3) - 1; // -1, 0, або +1
                baseOnline = Math.max(8, baseOnline + change);
                counterEl.innerText = baseOnline;
            }, 4000);
        }
    </script>
</body>
</html>
